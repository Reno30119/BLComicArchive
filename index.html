<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 深色模式：在 CSS 套用前就把明確設定寫到 <html> 上，避免載入時先閃一下
      // 錯的主題色再變回來。詳細切換邏輯在 js/theme-toggle.js。
      (function () {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>漫畫書庫 - 新增書籍</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect x=%2215%22 y=%2220%22 width=%2220%22 height=%2260%22 fill=%22%23e74c3c%22 rx=%222%22/><rect x=%2240%22 y=%2210%22 width=%2220%22 height=%2270%22 fill=%22%233498db%22 rx=%222%22/><rect x=%2265%22 y=%2225%22 width=%2220%22 height=%2255%22 fill=%22%23f1c40f%22 rx=%222%22/></svg>"
    />
    <link rel="manifest" href="assets/manifest.json" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="書庫" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#5f77a8" />
  </head>
  <body>
    <nav class="top-nav">
      <a href="index.html" class="nav-item active"><span class="nav-icon">➕</span><span class="nav-label">新增書籍</span></a>
      <a href="list.html" class="nav-item"><span class="nav-icon">🔍</span><span class="nav-label">查詢書庫</span></a>
      <a href="wishlist.html" class="nav-item"><span class="nav-icon">🛍️</span><span class="nav-label">待購清單</span></a>
      <a href="tags.html" class="nav-item"><span class="nav-icon">🏷️</span><span class="nav-label">標籤管理</span></a>
      <a href="backup.html" class="nav-item nav-item-icon-only" title="資料備份"><span class="nav-icon">💾</span></a>
      <span class="theme-toggle-wrap">
        <span class="theme-toggle-icon" aria-hidden="true">☀️</span>
        <button type="button" class="theme-toggle-switch" aria-label="切換深色模式"><span class="theme-toggle-knob"></span></button>
        <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
      </span>
    </nav>

    <div class="container">
      <header class="form-header">
        <h2>📚 新增書籍</h2>
        <div class="db-status-bar">
          <div id="dbCountBadge" class="status-badge">♻️ 正在載入書庫...</div>
          <div id="dbTimeBadge" class="status-badge">🕒 --:--</div>
          <button type="button" id="dbRefreshBtn" class="status-badge">
            🔄 重新讀取
          </button>
        </div>
      </header>

      <form id="bookForm">
        <div class="form-section-header">
          <span class="section-icon">📚</span>
          <h3 class="section-title">書籍資訊</h3>
        </div>
        <div class="form-group">
          <label for="title">中文書名</label>
          <div>
            <input
              type="text"
              id="title"
              name="title"
              required
              placeholder="請輸入書名"
              autocomplete="off"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-controls="titleRecommendationList"
            />
            <div class="title-system-root">
              <div id="titleRecommendationList" class="custom-tag-list" role="listbox" aria-label="書名建議清單"></div>
            </div>
          </div>
          <div id="searchFeedback" class="search-feedback"></div>
          <div
            id="duplicateBookCard"
            class="duplicate-book-card hidden"
            aria-live="polite"
          >
            <div class="duplicate-book-card-header">
              <strong>書庫已有這本書</strong>
              <button
                type="button"
                class="duplicate-dismiss-btn"
                onclick="dismissDuplicateCard()"
                aria-label="關閉重複書籍提示"
              >
                ✕
              </button>
            </div>
            <p id="duplicateBookDetails" class="duplicate-book-details"></p>
            <p class="duplicate-book-hint">
              可以帶入這本書已經填過的書名、作者、標籤等資料，只要再填你的評分和評語；也可以不理會，繼續填寫新的一筆。
            </p>
            <div class="duplicate-book-actions">
              <button
                type="button"
                id="duplicateAutofillBtn"
                class="duplicate-primary-btn"
              >
                帶入書籍資訊
              </button>
              <button
                type="button"
                class="duplicate-secondary-btn"
                onclick="dismissDuplicateCard()"
              >
                保留目前內容
              </button>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label for="jpTitle">日文書名</label>
          <input type="text" id="jpTitle" name="jpTitle" />
        </div>
        <div class="form-group">
          <label for="author">作者</label>
          <input type="text" id="author" name="author" required />
        </div>

        <div class="form-section-divider"></div>
        <div class="form-section-header">
          <span class="section-icon">📋</span>
          <h3 class="section-title">作品屬性</h3>
        </div>
        <div class="form-group">
          <label>分級</label>
          <div class="level-buttons">
            <button type="button" class="level-btn" data-level="清水">
              💧 清水
            </button>
            <button type="button" class="level-btn" data-level="肉少">
              🥗 肉少
            </button>
            <button type="button" class="level-btn active" data-level="正常">
              🍛 正常
            </button>
            <button type="button" class="level-btn" data-level="肉多">
              🥩 肉多
            </button>
          </div>
          <input type="hidden" id="level" name="level" value="正常" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="twStatus">🇹🇼 台灣連載狀態</label>
            <input type="text" id="twStatus" name="twStatus" />
          </div>
          <div class="form-group">
            <label for="jpStatus">🇯🇵 日本連載狀態</label>
            <input type="text" id="jpStatus" name="jpStatus" />
          </div>
        </div>
        <div class="form-section-divider"></div>
        <div class="form-section-header">
          <span class="section-icon">✍️</span>
          <h3 class="section-title">評論</h3>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>評論者</label>
            <div class="reviewer-buttons">
              <button type="button" class="rev-btn" data-name="Reno">
                Reno
              </button>
              <button type="button" class="rev-btn" data-name="茶壺">
                茶壺
              </button>
            </div>
            <input
              type="hidden"
              id="reviewer"
              name="reviewer"
              value=""
              required
            />
          </div>
          <div class="form-group">
            <label for="rating">評分 (1-10)</label>
            <div>
              <input
                type="number"
                id="rating"
                name="rating"
                min="1"
                max="10"
                step="0.5"
                value="5.0"
              />
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="tags">標籤 (以逗號 / 空白鍵分隔)</label>
          <input
            type="text"
            id="tags"
            name="tags"
            placeholder="輸入關鍵字或點選標籤..."
            autocomplete="off"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="customTagList"
          />

          <div class="tag-system-root">
            <div id="customTagList" class="custom-tag-list" role="listbox" aria-label="標籤建議清單"></div>

            <div class="tag-cloud-wrapper">
              <div id="tagCloud" class="tag-cloud"></div>
              <button
                type="button"
                id="toggleCloudBtn"
                class="toggle-cloud-btn"
              >
                展開標籤列表 ▼
              </button>
            </div>
          </div>
        </div>

        <input type="hidden" id="coverUrl" name="coverUrl" value="" />
        <div class="form-section-divider"></div>
        <div class="form-section-header">
          <span class="section-icon">🔗</span>
          <h3 class="section-title">連結</h3>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="ebookUrl"
              ><span class="url-platform-tag ebook-badge"
                >BookWalker</span
              ></label
            >
            <input type="url" id="ebookUrl" name="ebookUrl" />
          </div>
          <div class="form-group">
            <label for="chilUrl"
              ><span class="url-platform-tag chil-badge">ちるちる</span></label
            >
            <input type="url" id="chilUrl" name="chilUrl" />
          </div>
        </div>

        <div id="coverPreviewWrap" class="cover-preview-wrap">
          <div class="cover-preview-frame">
            <img id="coverPreviewImg" class="cover-preview-img" alt="封面預覽" />
            <div id="coverPreviewPlaceholder" class="cover-preview-placeholder"></div>
          </div>
          <div class="cover-preview-info">
            <div class="cover-preview-label">🖼️ 封面預覽</div>
            <div id="coverPreviewHint" class="cover-preview-hint"></div>
          </div>
        </div>

        <div class="form-group">
          <label for="comment">評語內容</label>
          <textarea id="comment" name="comment" rows="3"></textarea>
        </div>

        <div class="form-actions-row">
          <button type="submit" id="submitBtn">確認送出資料</button>
          <button
            type="button"
            class="icon-clear-btn"
            onclick="clearFullForm()"
            title="清空資料"
            aria-label="清空表單所有欄位"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 6h18"></path>
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
            </svg>
          </button>
        </div>
      </form>
    </div>

    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/theme-toggle.js"></script>
    <script type="module" src="js/index/index-main.js"></script>
    <div
      id="idx-toast"
      style="
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: #27ae60;
        color: white;
        padding: 10px 20px;
        border-radius: 50px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        transition: transform 0.4s;
        z-index: 9999;
        font-weight: bold;
        pointer-events: none;
      "
    ></div>
  </body>
</html>
