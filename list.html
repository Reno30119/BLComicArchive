<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>漫畫書庫 - 查詢系統</title>
    <link rel="stylesheet" href="list-style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>"
    />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="書庫" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#5f77a8" />
  </head>
  <body>
    <nav class="top-nav">
      <a href="index.html" class="nav-item">➕ 新增書籍</a>
      <a href="list.html" class="nav-item active">🔍 查詢書庫</a>
      <a href="wishlist.html" class="nav-item">🛍️ 待購清單</a>
      <a href="tags.html" class="nav-item">🏷️ 標籤管理</a>
    </nav>

    <div class="list-container">
      <header class="list-header">
        <div class="search-bar">
          <div
            style="
              position: relative;
              flex: 1;
              display: flex;
              align-items: center;
            "
          >
            <input
              type="text"
              id="searchInput"
              placeholder="搜尋書名、作者或標籤..."
              style="width: 100%; padding-right: 30px"
              autocomplete="off"
            />
            <span
              id="clearSearch"
              style="
                position: absolute;
                right: 20px;
                cursor: pointer;
                color: #ccc;
                display: none;
              "
              >✖</span
            >
            <div id="searchRecommendationList" class="custom-tag-list"></div>
          </div>
          <button
            type="button"
            onclick="
              window.open(BookArchive.SCRIPT_URL + '?action=read', '_blank')
            "
            style="
              background: #f39c12;
              color: white;
              border: none;
              padding: 10px 15px;
              border-radius: 8px;
              cursor: pointer;
              font-weight: bold;
              margin-right: 10px;
              font-size: 14px;
            "
          >
            🛠️ 測試 API
          </button>

          <button id="refreshBtn" class="refresh-btn" onclick="fetchData(true)">
            🔄 更新數據
          </button>
        </div>
        <div
          id="activeTagFilters"
          class="active-tag-filters"
          aria-live="polite"
        ></div>
        <div class="filter-panel">
          <div class="filter-panel-row">
            <span class="filter-panel-label">排序</span>
            <div class="filter-btn-group">
              <button
                class="fbtn sort-chip"
                data-sort="date"
                onclick="sortData('date')"
              >
                📅 最新
              </button>
              <button
                class="fbtn sort-chip active-chip"
                data-sort="updated"
                onclick="sortData('updated')"
              >
                🕐 近期更新
              </button>
              <button
                class="fbtn sort-chip"
                data-sort="rating"
                onclick="sortData('rating')"
              >
                ⭐ 評分
              </button>
              <button
                class="fbtn sort-chip"
                data-sort="author"
                onclick="sortData('author')"
              >
                🖋️ 作者
              </button>
              <button
                class="fbtn sort-chip"
                data-sort="title"
                onclick="sortData('title')"
              >
                📜 書名
              </button>
            </div>
          </div>
          <div class="filter-panel-divider"></div>
          <div class="filter-panel-row">
            <span class="filter-panel-label">篩選</span>
            <div class="filter-btn-group">
              <select
                id="levelFilter"
                class="fbtn fbtn-select"
                onchange="applyFilters()"
              >
                <option value="all">🍙 分級</option>
                <option value="肉多">🥩 肉多</option>
                <option value="正常">🍛 正常</option>
                <option value="肉少">🥗 肉少</option>
                <option value="清水">💧 清水</option>
              </select>
              <select
                id="ratingFilter"
                class="fbtn fbtn-select"
                onchange="applyFilters()"
              >
                <option value="all">💎 評分</option>
                <option value="8">8 分以上 ✨</option>
                <option value="6">6–7 分</option>
                <option value="0">5 分以下</option>
              </select>
              <select
                id="commentFilter"
                class="fbtn fbtn-select"
                onchange="applyFilters()"
              >
                <option value="all">💬 評語狀態</option>
                <option value="ratedWithoutComment">⭐ 已評分但無評語</option>
              </select>
            </div>
          </div>
          <div class="filter-panel-divider"></div>
          <div class="filter-panel-row">
            <span class="filter-panel-label">評論者</span>
            <div class="filter-btn-group">
              <button class="fbtn filter-btn active" data-reviewer="all">
                全部
              </button>
              <button class="fbtn filter-btn" data-reviewer="Reno">Reno</button>
              <button class="fbtn filter-btn" data-reviewer="茶壺">茶壺</button>
            </div>
            <button
              class="fbtn fbtn-reset"
              id="resetAllBtn"
              onclick="resetAllFilters()"
            >
              🧹 重置條件
            </button>
          </div>
        </div>
        <div id="resultCount" class="result-count"></div>
      </header>

      <div id="loading" class="loading-overlay">
        <div class="loading-content">
          <div class="spinner"></div>
          <p>正在同步最新書庫...</p>
        </div>
      </div>
      <div class="book-grid" id="bookGrid"></div>
    </div>

    <div id="editModal" class="modal hidden">
      <div class="modal-content">
        <h3 id="modalTitle">📝 編輯書籍資訊</h3>
        <form id="editForm">
          <input type="hidden" id="editTimestamp" name="timestamp" />
          <input type="hidden" id="oldTitle" name="oldTitle" />
          <input type="hidden" name="action" value="update" />

          <div id="infoFieldsGroup">
            <label>中文書名</label>
            <input type="text" id="editTitle" name="title" required />

            <label>日文書名</label>
            <input type="text" id="editJpTitle" name="jpTitle" />

            <label>作者</label>
            <input type="text" id="editAuthor" name="author" />
            <div style="display: flex; gap: 10px; margin-bottom: 15px">
              <div style="flex: 1">
                <label
                  style="display: block; font-size: 0.9em; margin-bottom: 5px"
                  >🇹🇼 台灣狀態</label
                >
                <input
                  type="text"
                  id="editTwStatus"
                  name="twStatus"
                  placeholder="台版進度"
                />
              </div>
              <div style="flex: 1">
                <label
                  style="display: block; font-size: 0.9em; margin-bottom: 5px"
                  >🇯🇵 日本狀態</label
                >
                <input
                  type="text"
                  id="editJpStatus"
                  name="jpStatus"
                  placeholder="日版進度"
                />
              </div>
            </div>
            <div style="display: flex; gap: 15px">
              <div style="flex: 1">
                <label>分級</label>
                <select id="editLevel" name="level">
                  <option value="肉多">🥩 肉多</option>
                  <option value="正常">🍛 正常</option>
                  <option value="肉少">🥗 肉少</option>
                  <option value="清水">💧 清水</option>
                </select>
              </div>
            </div>

            <label>標籤 (以逗號 / 空白鍵分隔)</label>
            <div style="position: relative">
              <input type="text" id="editTags" name="tags" autocomplete="off" />
              <div id="customTagList" class="custom-tag-list"></div>
            </div>

            <label>電子書網址</label>
            <input type="url" id="editEbookUrl" name="ebookUrl" />

            <label>ちるちる網址</label>
            <input type="url" id="editChilUrl" name="chilUrl" />
          </div>

          <div id="commentFieldsGroup">
            <label>評分 (1-10)</label>
            <input
              type="number"
              id="editRating"
              name="rating"
              step="0.5"
              min="1"
              max="10"
            />

            <label>我的評語</label>
            <textarea
              id="editComment"
              name="comment"
              rows="6"
              placeholder="分享你的讀後感..."
            ></textarea>
          </div>

          <div class="modal-btns">
            <button type="submit" class="save-btn">儲存修改</button>
            <button type="button" onclick="closeModal()" class="cancel-btn">
              取消
            </button>
          </div>
        </form>
      </div>
    </div>

    <div id="addCommentModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="addCommentModalTitle">✍️ 新增新評論</h3>
        </div>
        <form id="addCommentForm">
          <input type="hidden" id="addCommentTargetTitle" name="title" />
          <input type="hidden" id="addCommentJpTitle" name="jpTitle" />
          <input type="hidden" id="addCommentAuthor" name="author" />
          <input type="hidden" id="addCommentLevel" name="level" />
          <input type="hidden" id="addCommentTags" name="tags" />
          <input type="hidden" id="addCommentEbookUrl" name="ebookUrl" />
          <input type="hidden" id="addCommentChilUrl" name="chilUrl" />
          <input type="hidden" id="addCommentCoverUrl" name="coverUrl" />
          <input type="hidden" id="addCommentTwStatus" name="twStatus" />
          <input type="hidden" id="addCommentJpStatus" name="jpStatus" />

          <div class="form-group">
            <label>評論者</label>
            <div class="reviewer-options">
              <button
                type="button"
                class="rev-select-btn"
                onclick="setAddReviewer('Reno', this)"
              >
                Reno
              </button>
              <button
                type="button"
                class="rev-select-btn"
                onclick="setAddReviewer('茶壺', this)"
              >
                茶壺
              </button>
            </div>
            <input
              type="hidden"
              id="addCommentReviewer"
              name="reviewer"
              required
            />
            <div
              id="dupReviewWarning"
              style="
                display: none;
                margin-top: 8px;
                padding: 8px 12px;
                background: #fff8e1;
                border-left: 3px solid #f39c12;
                border-radius: 4px;
                font-size: 0.85em;
                color: #7d5a00;
              "
            >
              ⚠️ <span id="dupReviewMsg"></span>
            </div>
          </div>

          <div class="form-group">
            <label for="addCommentRating">評分 (0.0 - 10.0)</label>
            <input
              type="number"
              id="addCommentRating"
              name="rating"
              min="0"
              max="10"
              step="0.5"
              value="5.0"
            />
          </div>

          <div class="form-group">
            <label for="addCommentContent">評語內容</label>
            <textarea
              id="addCommentContent"
              name="comment"
              rows="4"
              required
            ></textarea>
          </div>

          <div class="modal-footer">
            <button
              type="submit"
              class="save-review-btn"
              id="addCommentSaveBtn"
            >
              確認送出
            </button>
            <button
              type="button"
              class="cancel-btn"
              onclick="closeAddCommentModal()"
            >
              取消
            </button>
          </div>
        </form>
      </div>
    </div>

    <div
      id="sync-toast"
      style="
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: #27ae60;
        color: white;
        padding: 10px 20px;
        border-radius: 50px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        transition: transform 0.4s;
        z-index: 9999;
        font-weight: bold;
        pointer-events: none;
      "
    >
      ✅ 資料已同步至最新版本
    </div>

    <script src="app.js"></script>
    <script>
      /**
       * ⚠️ 重要提示：
       * 每次修改 GAS 程式碼後，請點擊「部署」->「管理部署」->「編輯」->「版本：新版本」
       * 這樣才能確保 scriptURL 維持不變。
       */
      const scriptURL = BookArchive.SCRIPT_URL;

      let allBooks = [];
      let mergedBooks = [];
      let isSyncing = false;
      let syncToastTimer = null;

      window.addEventListener("DOMContentLoaded", () => {
        // 若從標籤管理頁點擊標籤跳轉而來，自動填入篩選條件
        const tagParam = new URLSearchParams(window.location.search).get("tag");
        if (tagParam) {
          const cb = document.getElementById("clearSearch");
          selectedSearchTags = [tagParam];
          renderActiveTagFilters();
          if (cb) cb.style.display = "block";
        }
        fetchData(false);
      });

      /**
       * 抓取資料函數
       * @param {boolean} isManual - 是否為手動按鈕觸發 (預設為 false)
       */
      async function fetchData(isManual = false) {
        const loadingEl = document.getElementById("loading");
        const refreshBtn = document.getElementById("refreshBtn");
        const cached = BookArchive.getBooksCache();
        const cachedData = cached.data;

        if (isSyncing) {
          if (isManual) showSyncToast("⚠️ 資料仍在同步中，請稍候", "info");
          return;
        }
        isSyncing = true;

        if (!isManual && !cachedData && loadingEl)
          loadingEl.style.display = "flex";

        if (refreshBtn) {
          refreshBtn.disabled = true;
          refreshBtn.innerHTML = "🔄 同步中...";
          refreshBtn.style.opacity = "0.7";
        }

        try {
          if (cachedData && allBooks.length === 0) {
            allBooks = cachedData;
            buildMergedBooks();
            applyFilters();
            if (loadingEl) loadingEl.style.display = "none";
          }

          // 一般進入頁面只使用 index/list 共用資料；只有按「更新數據」才讀 Google Sheet。
          if (cachedData && !isManual) return;

          const result = await BookArchive.loadBooks({ refresh: isManual });
          const previousDataString = JSON.stringify(cachedData || []);
          const newDataString = JSON.stringify(result.data);
          allBooks = result.data;
          buildMergedBooks();
          applyFilters();

          if (isManual) {
            showSyncToast(
              newDataString === previousDataString
                ? "✨ 目前已是最新資料"
                : "✅ 資料已更新",
              newDataString === previousDataString ? "info" : "success",
            );
          }
        } catch (error) {
          const timedOut = error.name === "AbortError";
          console.error("更新失敗:", error);
          showSyncToast(
            cachedData
              ? timedOut
                ? "⚠️ 同步逾時，正在顯示共用資料"
                : "⚠️ 同步失敗，正在顯示共用資料"
              : timedOut
                ? "❌ 連線逾時，請稍後再試"
                : `❌ 同步失敗：${error.message}`,
            "error",
          );
        } finally {
          isSyncing = false;
          if (refreshBtn) {
            refreshBtn.disabled = false;
            refreshBtn.innerHTML = "🔄 更新數據";
            refreshBtn.style.opacity = "1";
          }
          if (loadingEl) loadingEl.style.display = "none";
        }
      }

      function showSyncToast(message, type = "success") {
        const toastEl = document.getElementById("sync-toast");
        if (!toastEl) return;

        // 1. 先移除所有可能的顏色類別
        toastEl.classList.remove("toast-success", "toast-info", "toast-error");

        // 2. 根據傳入的 type 加入對應顏色
        toastEl.classList.add(`toast-${type}`);

        // 3. 設定文字並顯示
        toastEl.innerText = message;
        toastEl.classList.add("show");

        // 避免短時間內連續訊息讓舊計時器提早關閉新提示
        if (syncToastTimer) clearTimeout(syncToastTimer);
        syncToastTimer = setTimeout(() => {
          toastEl.classList.remove("show");
          syncToastTimer = null;
        }, 3000);
      }

      function openEditModal(ts) {
        // 找尋對應時間戳記的原始資料
        const book = allBooks.find((b) => String(b.timestamp) === String(ts));
        if (!book) return;

        // 將所有欄位填入表單，避免更新時漏掉資料
        document.getElementById("editTimestamp").value = book.timestamp || "";
        document.getElementById("editTitle").value = book.title || "";
        document.getElementById("editJpTitle").value = book.jpTitle || "";
        document.getElementById("editAuthor").value = book.author || "";
        document.getElementById("editLevel").value = book.level || "正常";
        document.getElementById("editRating").value = book.rating || 5;
        document.getElementById("editTags").value = book.tags || "";
        document.getElementById("editEbookUrl").value = book.ebookUrl || "";
        document.getElementById("editChilUrl").value = book.chilUrl || "";
        document.getElementById("editComment").value = book.comment || "";

        document.getElementById("editModal").classList.remove("hidden");
      }

      let currentReviewer = "all";

      // 2. 綁定按鈕點擊事件
      document.querySelectorAll(".filter-btn").forEach((btn) => {
        btn.addEventListener("click", function () {
          // 切換按鈕樣式
          document
            .querySelectorAll(".filter-btn")
            .forEach((b) => b.classList.remove("active"));
          this.classList.add("active");

          // 更新篩選狀態並重新渲染
          currentReviewer = this.getAttribute("data-reviewer");
          applyFilters();
        });
      });

      function renderBooks(data) {
        const grid = document.getElementById("bookGrid");
        if (!grid) return;

        grid.innerHTML = "";
        const fragment = document.createDocumentFragment();

        const filteredData = data.filter(
          (item) => item.title && String(item.title).trim() !== "",
        );

        const countEl = document.getElementById("resultCount");
        if (countEl) {
          countEl.textContent =
            filteredData.length > 0
              ? `共 ${filteredData.length} 本書籍`
              : "無符合條件的書籍";
        }

        filteredData.forEach((book) => {
          const row = document.createElement("div");
          row.className = "book-list-item";
          row.dataset.level = book.level || "";

          const avgRating = parseFloat(book.avgRating || 0).toFixed(1);
          const ratingVal = parseFloat(avgRating);
          row.dataset.ratingTier =
            ratingVal < 5.5 ? "low" : ratingVal <= 7 ? "mid" : "high";

          const coverHTML =
            book.coverUrl && book.coverUrl !== ""
              ? `<img src="${book.coverUrl}" alt="封面" loading="lazy"
                data-title="${(book.title || "").replace(/"/g, "&quot;")}"
                data-bw="${(book.ebookUrl || "").replace(/"/g, "&quot;")}"
                data-chil="${(book.chilUrl || "").replace(/"/g, "&quot;")}"
                onerror="handleCoverError(this)">`
              : `<div class="no-cover">
                 <span>無封面</span>
                 <button onclick="reFetchCover('${book.title.replace(/'/g, "\\'")}', '${book.ebookUrl || ""}', '${book.chilUrl || ""}', event)">🔍 抓取</button>
               </div>`;

          const tagsHTML = (book.tags ? String(book.tags).split(",") : [])
            .map((t) => {
              const tag = t.trim();
              return tag
                ? `<span class="tag-badge" onclick="quickSearch('${tag.replace(/'/g, "\\'")}', 'tag')">#${tag}</span>`
                : "";
            })
            .join("");

          const reviewsHTML = (book.reviews || [])
            .map(
              (r) => `
              <div class="mini-review">
                <span class="rev-name">${r.reviewer}</span>
                <span class="rev-sep">|</span>
                <span class="rev-score ${getScoreColor(r.rating)}">⭐ ${r.rating}</span>
                <span class="rev-comment">${r.comment}</span>
                <button class="small-edit-btn" onclick="openCommentModal('${r.timestamp}')">✎</button>
              </div>
            `,
            )
            .join("");

          row.innerHTML = `
            <div class="item-main">
              <div class="book-cover-side">${coverHTML}</div>
              <div class="item-info">
                <div class="title-row">
                  <span class="badge ${getLevelColor(book.level)}">${book.level}</span>
                  <h3 class="title">${book.title}</h3>
                  <span class="avg-score ${getScoreColor(avgRating)}">${avgRating}</span>
                  <button class="edit-book-btn" onclick="openBookInfoModal('${book.reviews[0]?.timestamp || ""}')" title="編輯書籍基本資訊">⚙️</button>
                </div>
                <p class="author">
                  👤 <span class="author-link" onclick="quickSearch('${book.author.replace(/'/g, "\\'")}')">${book.author}</span>
                  <span class="jp-title">${book.jpTitle || ""}</span>
                </p>
                <div class="status-row">
                  <span class="status-badge-tw">🇹🇼 台：${book.twStatus || "-"}</span>
                  <span class="status-badge-jp">🇯🇵 日：${book.jpStatus || "-"}</span>
                </div>
                <div class="tags">${tagsHTML}</div>
                <div class="item-links">
                  ${book.ebookUrl ? `<a href="${book.ebookUrl}" target="_blank" class="link-icon ebook">📖 BookWalker</a>` : ""}
                  ${book.chilUrl ? `<a href="${book.chilUrl}" target="_blank" class="link-icon chil">🍒 ちるちる</a>` : ""}
                  <div class="add-review-action-area">
                    <button class="add-review-btn mobile-up-btn" onclick="openAddCommentModal('${book.reviews[0]?.timestamp || ""}')">📝 新增評論</button>
                  </div>
                </div>
                <div class="item-reviews">${reviewsHTML}</div>
              </div>
            </div>`;

          fragment.appendChild(row);
        });

        grid.appendChild(fragment);
      }
      async function fetchWithTimeout(url, timeoutMs = 15000) {
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeoutMs);
        try {
          const res = await fetch(url, { signal: controller.signal });
          clearTimeout(id);
          return res;
        } catch (err) {
          clearTimeout(id);
          throw err;
        }
      }

      function handleCoverError(img) {
        const title = img.dataset.title || "";
        const bw = img.dataset.bw || "";
        const chil = img.dataset.chil || "";
        img.parentElement.innerHTML = `<div class="no-cover"><span>無封面</span><button onclick="reFetchCover('${title.replace(/'/g, "\\'")}', '${bw.replace(/'/g, "\\'")}', '${chil.replace(/'/g, "\\'")}', event)">🔍 抓取</button></div>`;
      }

      // 1. 抓取封面的補救功能
      async function reFetchCover(title, bwUrl, chilUrl, event) {
        // 優先順序：BookWalker > Chil-Chil
        // 檢查網址是否有效 (排除空字串或 "undefined" 字串)
        let urlToFetch =
          bwUrl && bwUrl !== "" && bwUrl !== "undefined" ? bwUrl : null;

        if (!urlToFetch) {
          urlToFetch =
            chilUrl && chilUrl !== "" && chilUrl !== "undefined"
              ? chilUrl
              : null;
        }

        if (!urlToFetch) {
          showSyncToast(
            "❌ 缺少 BookWalker 或 ちるちる 網址，請先編輯書籍資訊",
            "error",
          );
          return;
        }

        const btn = event.target;
        const coverContainer = btn.closest(".book-cover-side");
        const originalContent = coverContainer.innerHTML;
        coverContainer.innerHTML = "<span>⌛ 抓取中...</span>";

        try {
          const fetchUrl = `${scriptURL}?action=fetchCover&url=${encodeURIComponent(
            urlToFetch,
          )}`;
          const res = await fetchWithTimeout(fetchUrl);
          const data = await res.json();

          if (data.coverUrl) {
            coverContainer.innerHTML = `<img src="${data.coverUrl}" alt="封面">`;

            // 同步更新回試算表
            const formData = new FormData();
            formData.append("title", title);
            formData.append("coverUrl", data.coverUrl);
            formData.append("action", "updateCoverOnly");

            fetch(scriptURL, { method: "POST", body: formData });
            showSyncToast("✅ 封面抓取成功", "success");
          } else {
            coverContainer.innerHTML = originalContent;
            showSyncToast(
              "❌ 抓取失敗：" + (data.error || "找不到圖片"),
              "error",
            );
          }
        } catch (e) {
          coverContainer.innerHTML = originalContent;
          console.error("抓取錯誤:", e);
          showSyncToast(
            e.name === "AbortError"
              ? "❌ 抓取逾時，請稍後再試"
              : "❌ 連線錯誤，請檢查網路或 GAS 狀態",
            "error",
          );
        }
      }

      let currentSortType = "updated"; // 預設依最近更新

      // 統一排序入口
      function sortData(type) {

      // 預計算合併書籍（資料更新時才呼叫，不在每次篩選時重算）
      function buildMergedBooks() {
        const validData = allBooks.filter(
          (item) => item.title && String(item.title).trim() !== "",
        );

        const merged = validData.reduce((acc, curr) => {
          const bookTitle = String(curr.title).trim();
          if (!acc[bookTitle]) {
            acc[bookTitle] = {
              ...curr,
              title: bookTitle,
              reviews: [],
              tags: curr.tags || "",
            };
          }
          acc[bookTitle].reviews.push({
            reviewer: curr.reviewer || "匿名",
            rating: parseFloat(curr.rating) || 0,
            comment: curr.comment || "",
            timestamp: curr.timestamp,
          });
          return acc;
        }, {});

        mergedBooks = Object.values(merged).map((book) => {
          const totalRating = book.reviews.reduce(
            (sum, r) => sum + r.rating,
            0,
          );
          book.avgRating = totalRating / book.reviews.length;
          book.latestTimestamp = Math.max(
            ...book.reviews.map((r) => new Date(r.timestamp).getTime()),
          );
          book.reviews.sort((a, b) =>
            String(a.reviewer).localeCompare(String(b.reviewer), "zh-Hant"),
          );
          return book;
        });
      }

      // 核心過濾邏輯：直接對已合併的 mergedBooks 做篩選與排序
      function applyFilters() {
        const searchTerm = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const selectedSearchTagsForFilter = getSelectedSearchTags();

        const ratingThreshold = document.getElementById("ratingFilter").value;
        const levelThreshold = document.getElementById("levelFilter").value;
        const commentStatus = document.getElementById("commentFilter").value;

        // 執行過濾
        let filtered = mergedBooks.filter((book) => {
          // --- 【搜尋邏輯修正開始】 ---
          const query = searchTerm.trim();
          const selectedTags = selectedSearchTagsForFilter;
          const textQuery = query;
          const bookTagList = String(book.tags || "")
            .toLowerCase()
            .split(/[ ,、]+/)
            .map((tag) => tag.trim())
            .filter(Boolean);

          const matchSelectedTags = selectedTags.every((tag) =>
            bookTagList.includes(tag.toLowerCase()),
          );

          let matchText = true;
          if (textQuery) {
            const matchTitle = book.title.toLowerCase().includes(textQuery);
            const matchJpTitle = (book.jpTitle || "")
              .toLowerCase()
              .includes(textQuery);
            const matchAuthor = (book.author || "")
              .toLowerCase()
              .includes(textQuery);
            const matchTags = bookTagList.some((tag) =>
              tag.includes(textQuery),
            );
            matchText = matchTitle || matchJpTitle || matchAuthor || matchTags;
          }

          // 多重標籤使用 AND；一般文字搜尋仍維持原本的模糊搜尋。
          const matchSearch = matchSelectedTags && matchText;
          // --- 【搜尋邏輯修正結束】 ---

          // B. 分數區間過濾
          let matchRating = true;
          const score = book.avgRating;
          if (ratingThreshold === "8") matchRating = score >= 8;
          else if (ratingThreshold === "6")
            matchRating = score >= 6 && score < 8;
          else if (ratingThreshold === "0") matchRating = score < 6;

          // C. 評論者篩選邏輯
          const matchReviewer =
            currentReviewer === "all" ||
            book.reviews.some((r) => r.reviewer === currentReviewer);

          // D. 分級過濾邏輯
          const matchLevel =
            levelThreshold === "all" || book.level === levelThreshold;

          // E. 找出已有有效評分，但評語仍為空白的評論。
          const matchCommentStatus =
            commentStatus === "all" ||
            book.reviews.some(
              (review) =>
                review.rating > 0 && !String(review.comment || "").trim(),
            );

          return (
            matchSearch &&
            matchRating &&
            matchReviewer &&
            matchLevel &&
            matchCommentStatus
          );
        });

        // 4. 排序邏輯
        filtered.sort((a, b) => {
          if (currentSortType === "rating") return b.avgRating - a.avgRating;
          if (currentSortType === "author")
            return String(a.author).localeCompare(String(b.author), "zh-Hant");
          if (currentSortType === "title")
            return String(a.title).localeCompare(String(b.title), "zh-Hant");
          if (currentSortType === "updated")
            return b.latestTimestamp - a.latestTimestamp;
          if (currentSortType === "date")
            return new Date(b.timestamp) - new Date(a.timestamp);
          return 0;
        });

        renderBooks(filtered);
      }

          // 1. 建立正規化函式：統一換行符號為 \n，並去除前後多餘空白
          const normalize = (str) => str.replace(/\r\n/g, "\n").trim();

          const expectedTitle = normalize(String(formData.get("title") || ""));

            matches: (books) =>
              books.some(
                (book) =>
                  // 4. 對回傳的資料也進行相同的正規化比對
                  normalize(String(book.title || "")) === expectedTitle &&
                  normalize(String(book.reviewer || "")) === expectedReviewer &&
                  normalize(String(book.comment || "")) === expectedComment,
              ),
          });

          ratingInput.classList.remove(
            "rating-low",
            "rating-mid",

          );

            ratingInput.classList.add("rating-low");
          } else if (val <= 7) {
            ratingInput.classList.add("rating-mid");
          } else {
            ratingInput.classList.add("rating-high");
          }
        });

      // 為「編輯評論」的分數欄位綁定變色邏輯
      document
        .getElementById("editRating")
        .addEventListener("input", function () {
          const val = parseFloat(this.value);
          const ratingInput = this;

          // 清除舊類別
          ratingInput.classList.remove(
            "rating-low",
            "rating-mid",
            "rating-high",
          );

          // 套用新類別
          if (val < 5.5) {
            ratingInput.classList.add("rating-low");
          } else if (val <= 7) {
            ratingInput.classList.add("rating-mid");
          } else {
            ratingInput.classList.add("rating-high");
          }
        });

      document
        .getElementById("editTags")
        .addEventListener("input", function (e) {
          let val = this.value;

          // 將「空白」或「全形頓號」即時替換為半形逗號
          if (val.includes(" ") || val.includes("、")) {
            this.value = val.replace(/[ 、]+/g, ",");
          }

          // 防止出現連續逗號
          this.value = this.value.replace(/,+/g, ",");
        });

      let allDefinedTags = []; // 用來存儲從 Tags 分頁抓來的資料

      // 1. 初始化抓取標籤定義 (可以在 fetchData 內或 window.onload 執行)
      async function fetchTagDefinitions() {
        try {
          const res = await fetch(`${scriptURL}?action=readTags`);
          allDefinedTags = await res.json();
        } catch (e) {
          console.error("載入標籤定義失敗", e);
        }
      }

      // 2. 監聽編輯框的輸入
      const editTagInput = document.getElementById("editTags");
      const customList = document.getElementById("customTagList");

      editTagInput.addEventListener("input", function () {
        const fullVal = this.value;
        // 支援空白、逗號、頓號分割
        const parts = fullVal.split(/[ ,、]+/);
        const currentQuery = parts[parts.length - 1].trim().toLowerCase();

        if (currentQuery === "") {
          customList.style.display = "none";
          customList.removeAttribute("data-active-index");
          return;
        }

        const matches = allDefinedTags.filter((t) =>
          t.name.toLowerCase().includes(currentQuery),
        );

        if (matches.length > 0) {
          customList.innerHTML = matches
            .map(
              (t) => `
      <div class="tag-item" data-tag-name="${t.name.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;")}" onclick="applyTagToEdit('${t.name.replace(/'/g, "\\'")}')">
        <strong>${t.name}</strong>
        <span class="tag-desc">${t.definition || ""}</span>
      </div>
    `,
            )
            .join("");
          customList.style.display = "block";
        } else {
          customList.style.display = "none";
        }
        customList.removeAttribute("data-active-index");
      });

      editTagInput.addEventListener("keydown", (event) => {
        const items = customList.querySelectorAll(".tag-item");
        const isVisible =
          customList.style.display !== "none" && items.length > 0;
        if (!isVisible) return;

        const activeIndex = Number(customList.dataset.activeIndex);
        if (event.key === "ArrowDown") {
          event.preventDefault();
          updateEditTagRecommendationHighlight(
            Number.isInteger(activeIndex) ? activeIndex + 1 : 0,
          );
        } else if (event.key === "ArrowUp") {
          event.preventDefault();
          updateEditTagRecommendationHighlight(
            Number.isInteger(activeIndex) ? activeIndex - 1 : items.length - 1,
          );
        } else if (event.key === "Enter") {
          if (Number.isInteger(activeIndex) && activeIndex >= 0) {
            event.preventDefault();
            const tagName = items[activeIndex].dataset.tagName;
            if (tagName) applyTagToEdit(tagName);
          }
        } else if (event.key === "Escape") {
          event.preventDefault();
          customList.style.display = "none";
          customList.removeAttribute("data-active-index");
        }
      });

      function updateEditTagRecommendationHighlight(index) {
        const items = customList.querySelectorAll(".tag-item");
        if (!items.length) return;
        const safeIndex = (index + items.length) % items.length;
        items.forEach((item, itemIndex) => {
          const isActive = itemIndex === safeIndex;
          item.classList.toggle("keyboard-active", isActive);
          item.setAttribute("aria-selected", String(isActive));
        });
        customList.setAttribute("data-active-index", String(safeIndex));
        items[safeIndex].scrollIntoView({ block: "nearest" });
      }

      // 3. 點選推薦標籤後的動作
      window.applyTagToEdit = function (tagName) {
        let parts = editTagInput.value.split(/[ ,、]+/);
        parts[parts.length - 1] = tagName; // 替換最後一個詞

        // 統一格式為「標籤, 標籤」
        editTagInput.value =
          parts
            .map((p) => p.trim())
            .filter((p) => p !== "")
            .join(", ") + ", ";

        customList.style.display = "none";
        customList.removeAttribute("data-active-index");
        editTagInput.focus();
      };

      // 4. 點擊外部關閉選單
      document.addEventListener("click", (e) => {
        if (e.target !== editTagInput) customList.style.display = "none";
      });

      // 5. 在頁面載入時執行初始化
      window.addEventListener("DOMContentLoaded", fetchTagDefinitions);

      const searchInput = document.getElementById("searchInput");
      const searchRecList = document.getElementById("searchRecommendationList");
      const activeTagFilters = document.getElementById("activeTagFilters");
      let selectedSearchTags = [];

      function getSelectedSearchTags() {
        return selectedSearchTags;
      }

      function renderActiveTagFilters() {
        const tags = getSelectedSearchTags();
        if (!tags.length) {
          activeTagFilters.innerHTML = "";
          activeTagFilters.style.display = "none";
          return;
        }

        activeTagFilters.innerHTML = `
          <span class="active-tag-filter-label">標籤條件（全部符合）</span>
          ${tags.map((tag) => `<button type="button" class="active-tag-filter" data-tag="${tag.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;")}">#${tag}<span aria-hidden="true">×</span></button>`).join("")}
          <button type="button" class="clear-tag-filters">清除標籤</button>
        `;
        activeTagFilters.style.display = "flex";
      }

      function setSearchTags(tags) {
        selectedSearchTags = [...new Set(tags.filter(Boolean))];
        cBtn.style.display =
          searchInput.value || selectedSearchTags.length ? "block" : "none";
        renderActiveTagFilters();
        applyFilters();
      }

      function addSearchTag(tag) {
        const normalizedTag = tag.replace(/^#/, "").trim();
        if (!normalizedTag) return;

        setSearchTags([...getSelectedSearchTags(), normalizedTag]);
        searchInput.value = "";
        searchRecList.style.display = "none";
        searchRecList.removeAttribute("data-active-index");
        searchInput.focus();
      }

      activeTagFilters.addEventListener("click", (event) => {
        const tagButton = event.target.closest(".active-tag-filter");
        if (tagButton) {
          setSearchTags(
            getSelectedSearchTags().filter(
              (tag) => tag !== tagButton.dataset.tag,
            ),
          );
          searchInput.focus();
          return;
        }
        if (event.target.closest(".clear-tag-filters")) {
          setSearchTags([]);
          searchInput.focus();
        }
      });

      searchInput.addEventListener("input", function () {
        renderActiveTagFilters();
        const val = this.value.trim().toLowerCase();
        const searchRecList = document.getElementById(
          "searchRecommendationList",
        );

        if (!val) {
          searchRecList.style.display = "none";
          searchRecList.removeAttribute("data-active-index");
          return;
        }

        let suggestions = [];

        allBooks.forEach((book) => {
          const title = (book.title || "").toString();
          const author = (book.author || "").toString();
          const tags = (book.tags || "").toString();

          const authorSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 80 80" class="rec-icon"><g fill="none" stroke-linejoin="round" stroke-width="4"><path fill="#f2c94c" stroke="#f2c94c" stroke-linecap="square" d="M60 70H20a4 4 0 0 1-4-4a15.87 15.87 0 0 1 10.3-14.86l1.23-.462a35.53 35.53 0 0 1 24.94 0l1.23.462A15.87 15.87 0 0 1 64 66a4 4 0 0 1-4 4Z"/><path fill="#f2994a" stroke="#f2994a" stroke-linecap="round" d="M33.902 38.867a13.347 13.347 0 0 0 19.15-9.08l.223-1.044a14.2 14.2 0 0 0-2.51-11.466l-.36-.48a12.992 12.992 0 0 0-20.81 0l-.36.48a14.2 14.2 0 0 0-2.51 11.465l.223 1.046a13.35 13.35 0 0 0 6.953 9.08"/></g></svg>`;

          // 1. 書名匹配
          if (title.toLowerCase().includes(val)) {
            suggestions.push({
              text: title,
              sub: author,
              icon: "📖",
              type: "normal",
            });
          }
          // 2. 作者匹配
          if (author && author.toLowerCase().includes(val)) {
            suggestions.push({
              text: author,
              sub: "【作者】",
              icon: "👤",
              type: "normal",
            });
          }
          // 3. 標籤匹配 (關鍵：標記為 tag 類型)
          if (tags && tags.toLowerCase().includes(val)) {
            const tagArr = tags.split(/[ ,、]+/);
            tagArr.forEach((t) => {
              if (t.trim().toLowerCase().includes(val)) {
                suggestions.push({
                  text: t.trim(),
                  sub: "【標籤】",
                  icon: "🏷️",
                  type: "tag",
                });
              }
            });
          }
        });

        // 去重
        const uniqueMatches = Array.from(
          new Map(suggestions.map((s) => [s.text, s])).values(),
        ).slice(0, 10);

        if (uniqueMatches.length > 0) {
          searchRecList.innerHTML = uniqueMatches
            .map(
              (item) => `
      <div class="tag-item" data-value="${item.text.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;")}" data-type="${item.type}" onclick="selectSearchRec('${item.text.replace(/'/g, "\\'")}', '${item.type}')">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${item.icon} ${item.text}</span>
          <span class="rec-author">${item.sub}</span>
        </div>
      </div>
    `,
            )
            .join("");
          searchRecList.style.display = "block";
          searchRecList.removeAttribute("data-active-index");
        } else {
          searchRecList.style.display = "none";
          searchRecList.removeAttribute("data-active-index");
        }
      });

      function updateSearchRecommendationHighlight(index) {
        const items = searchRecList.querySelectorAll(".tag-item");
        if (!items.length) {
          searchRecList.removeAttribute("data-active-index");
          return;
        }

        const safeIndex = (index + items.length) % items.length;
        items.forEach((item, itemIndex) => {
          const isActive = itemIndex === safeIndex;
          item.classList.toggle("keyboard-active", isActive);
          item.setAttribute("aria-selected", String(isActive));
        });
        searchRecList.setAttribute("data-active-index", String(safeIndex));
        items[safeIndex].scrollIntoView({ block: "nearest" });
      }

      function chooseSearchRecommendation(index) {
        const item = searchRecList.querySelectorAll(".tag-item")[index];
        if (!item) return;
        selectSearchRec(item.dataset.value, item.dataset.type);
      }

      // 推薦清單開啟時可使用上下方向鍵，Enter 確認選項，Escape 關閉清單。
      searchInput.addEventListener("keydown", (event) => {
        const items = searchRecList.querySelectorAll(".tag-item");
        const isVisible =
          searchRecList.style.display !== "none" && items.length > 0;
        if (!isVisible) return;

        const activeIndex = Number(searchRecList.dataset.activeIndex);
        if (event.key === "ArrowDown") {
          event.preventDefault();
          updateSearchRecommendationHighlight(
            Number.isInteger(activeIndex) ? activeIndex + 1 : 0,
          );
        } else if (event.key === "ArrowUp") {
          event.preventDefault();
          updateSearchRecommendationHighlight(
            Number.isInteger(activeIndex) ? activeIndex - 1 : items.length - 1,
          );
        } else if (event.key === "Enter") {
          event.preventDefault();
          if (Number.isInteger(activeIndex) && activeIndex >= 0) {
            chooseSearchRecommendation(activeIndex);
          } else {
            addSearchTag(searchInput.value);
            searchRecList.style.display = "none";
            searchRecList.removeAttribute("data-active-index");
          }
        } else if (event.key === "Escape") {
          event.preventDefault();
          searchRecList.style.display = "none";
          searchRecList.removeAttribute("data-active-index");
        }
      });

      window.selectSearchRec = function (text, type) {
        const searchInput = document.getElementById("searchInput");
        const searchRecList = document.getElementById(
          "searchRecommendationList",
        );
        const clearBtn = document.getElementById("clearSearch");

        // 如果類型是 tag，自動在前面加個 # 符號，變成標籤專用搜尋模式
        if (type === "tag") {
          const selectedTags = getSelectedSearchTags();
          if (!selectedTags.includes(text)) selectedTags.push(text);
          setSearchTags(selectedTags);
          // 選擇推薦標籤後，移除原本輸入的關鍵字，避免殘留在搜尋框。
          searchInput.value = "";
        } else {
          searchInput.value = text;
          renderActiveTagFilters();
        }

        if (clearBtn) clearBtn.style.display = "block";
        if (searchRecList) {
          searchRecList.style.display = "none";
          searchRecList.removeAttribute("data-active-index");
        }

        // 執行你原本的過濾邏輯
        if (typeof applyFilters === "function") {
          applyFilters();
        }

        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      // 點擊空白處關閉
      document.addEventListener("click", (e) => {
        if (e.target !== searchInput) searchRecList.style.display = "none";
      });
    </script>
  </body>
</html>
