<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 深色模式：在 CSS 套用前就把明確設定寫到 <html> 上，避免載入時先閃一下
      // 錯的主題色再變回來。詳細切換邏輯在 js/theme-toggle.js。
      (function () {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>漫畫書庫 - 查詢系統</title>
    <link rel="stylesheet" href="css/list-style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>"
    />
    <link rel="manifest" href="assets/manifest.json" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="書庫" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#5f77a8" />
  </head>
  <body>
    <nav class="top-nav">
      <a href="index.html" class="nav-item"
        ><span class="nav-icon">➕</span
        ><span class="nav-label">新增書籍</span></a
      >
      <a href="list.html" class="nav-item active"
        ><span class="nav-icon">🔍</span
        ><span class="nav-label">查詢書庫</span></a
      >
      <a href="wishlist.html" class="nav-item"
        ><span class="nav-icon">🛍️</span
        ><span class="nav-label">待購清單</span></a
      >
      <a href="tags.html" class="nav-item"
        ><span class="nav-icon">🏷️</span
        ><span class="nav-label">標籤管理</span></a
      >
      <a href="backup.html" class="nav-item nav-item-icon-only" title="資料備份"
        ><span class="nav-icon">💾</span></a
      >
      <span class="theme-toggle-wrap">
        <span class="theme-toggle-icon" aria-hidden="true">☀️</span>
        <button
          type="button"
          class="theme-toggle-switch"
          aria-label="切換深色模式"
        >
          <span class="theme-toggle-knob"></span>
        </button>
        <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
      </span>
    </nav>

    <main class="list-container">
      <h1 class="sr-only">漫畫書庫查詢系統</h1>
      <header class="list-header">
        <div class="search-bar">
          <div
            style="
              position: relative;
              flex: 1;
              display: flex;
              align-items: center;
            "
          >
            <input
              type="text"
              id="searchInput"
              placeholder="搜尋書名、作者或標籤..."
              aria-label="搜尋書名、作者或標籤"
              style="width: 100%; padding-right: 30px"
              autocomplete="off"
            />
            <span
              id="clearSearch"
              style="
                position: absolute;
                right: 20px;
                cursor: pointer;
                color: #ccc;
                display: none;
              "
              >✖</span
            >
            <div id="searchRecommendationList" class="custom-tag-list"></div>
          </div>

          <button id="refreshBtn" class="refresh-btn" onclick="fetchData(true)">
            🔄 更新書庫
          </button>
        </div>
        <div
          id="activeTagFilters"
          class="active-tag-filters"
          aria-live="polite"
        ></div>
        <div class="filter-panel">
          <div class="filter-panel-row">
            <span class="filter-panel-label">排序</span>
            <div class="sort-select-group">
              <div class="custom-select-wrap" id="sortFieldWrap">
                <button
                  type="button"
                  id="sortFieldToggle"
                  class="fbtn custom-select-toggle has-active-filter"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                  aria-controls="sortFieldDropdown"
                >
                  <span class="custom-select-label">🕐 近期更新</span>
                </button>
                <div
                  id="sortFieldDropdown"
                  class="custom-select-dropdown hidden"
                  role="listbox"
                >
                  <div
                    class="custom-select-option"
                    data-sort="date"
                    role="option"
                  >
                    📅 最新
                  </div>
                  <div
                    class="custom-select-option selected"
                    data-sort="updated"
                    role="option"
                    aria-selected="true"
                  >
                    🕐 近期更新
                  </div>
                  <div
                    class="custom-select-option"
                    data-sort="rating"
                    role="option"
                  >
                    ⭐ 評分
                  </div>
                  <div
                    class="custom-select-option"
                    data-sort="author"
                    role="option"
                  >
                    🖋️ 作者
                  </div>
                  <div
                    class="custom-select-option"
                    data-sort="title"
                    role="option"
                  >
                    📜 書名
                  </div>
                </div>
              </div>
              <button
                type="button"
                id="sortDirToggle"
                class="fbtn sort-dir-toggle"
                title="反轉排序方向"
                aria-label="目前由大到小，點擊改成由小到大"
              >
                ▼
              </button>
            </div>
          </div>
          <div class="filter-panel-divider"></div>
          <div class="filter-panel-row">
            <span class="filter-panel-label">篩選</span>
            <div class="filter-btn-group">
              <div class="custom-select-wrap" id="levelFilterWrap">
                <button
                  type="button"
                  id="levelFilterToggle"
                  class="fbtn custom-select-toggle"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                  aria-controls="levelFilterDropdown"
                >
                  <span class="custom-select-label">🍙 分級</span>
                </button>
                <div
                  id="levelFilterDropdown"
                  class="custom-select-dropdown hidden"
                  role="listbox"
                >
                  <div
                    class="custom-select-option"
                    data-value="all"
                    role="option"
                  >
                    🍙 分級
                  </div>
                  <div
                    class="custom-select-option"
                    data-value="肉多"
                    role="option"
                  >
                    🥩 肉多
                  </div>
                  <div
                    class="custom-select-option"
                    data-value="正常"
                    role="option"
                  >
                    🍛 正常
                  </div>
                  <div
                    class="custom-select-option"
                    data-value="肉少"
                    role="option"
                  >
                    🥗 肉少
                  </div>
                  <div
                    class="custom-select-option"
                    data-value="清水"
                    role="option"
                  >
                    💧 清水
                  </div>
                </div>
                <input type="hidden" id="levelFilter" value="all" />
              </div>
              <div class="custom-select-wrap" id="ratingFilterWrap">
                <button
                  type="button"
                  id="ratingFilterToggle"
                  class="fbtn custom-select-toggle"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                  aria-controls="ratingFilterDropdown"
                >
                  <span class="custom-select-label">💎 評分</span>
                </button>
                <div
                  id="ratingFilterDropdown"
                  class="custom-select-dropdown hidden"
                  role="listbox"
                >
                  <div
                    class="custom-select-option"
                    data-value="all"
                    role="option"
                  >
                    💎 評分
                  </div>
                  <div
                    class="custom-select-option"
                    data-value="8"
                    role="option"
                  >
                    8 分以上 ✨
                  </div>
                  <div
                    class="custom-select-option"
                    data-value="6"
                    role="option"
                  >
                    6–7 分
                  </div>
                  <div
                    class="custom-select-option"
                    data-value="0"
                    role="option"
                  >
                    5 分以下
                  </div>
                </div>
                <input type="hidden" id="ratingFilter" value="all" />
              </div>
              <div class="custom-select-wrap" id="commentFilterWrap">
                <button
                  type="button"
                  id="commentFilterToggle"
                  class="fbtn custom-select-toggle"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                  aria-controls="commentFilterDropdown"
                >
                  <span class="custom-select-label">💬 評語狀態</span>
                </button>
                <div
                  id="commentFilterDropdown"
                  class="custom-select-dropdown hidden"
                  role="listbox"
                >
                  <div
                    class="custom-select-option"
                    data-value="all"
                    role="option"
                  >
                    💬 評語狀態
                  </div>
                  <div
                    class="custom-select-option"
                    data-value="ratedWithoutComment"
                    role="option"
                  >
                    ⭐ 已評分但無評語
                  </div>
                </div>
                <input type="hidden" id="commentFilter" value="all" />
              </div>
            </div>
          </div>
          <div class="filter-panel-divider"></div>
          <div class="filter-panel-row">
            <span class="filter-panel-label">標籤</span>
            <div class="tag-filter-picker">
              <button
                type="button"
                id="tagFilterToggleBtn"
                class="fbtn tag-filter-toggle-btn"
                aria-haspopup="true"
                aria-expanded="false"
                aria-controls="tagFilterDropdown"
              >
                🏷️ 選擇標籤<span
                  id="tagFilterCount"
                  class="tag-filter-count hidden"
                  >0</span
                >
              </button>
              <div id="tagFilterDropdown" class="tag-filter-dropdown hidden">
                <input
                  type="text"
                  id="tagFilterSearch"
                  class="tag-filter-search"
                  placeholder="搜尋標籤..."
                  aria-label="搜尋標籤"
                  autocomplete="off"
                />
                <div
                  id="tagFilterList"
                  class="tag-filter-list"
                  role="listbox"
                  aria-multiselectable="true"
                ></div>
              </div>
            </div>
          </div>
          <div class="filter-panel-divider"></div>
          <div class="filter-panel-row">
            <span class="filter-panel-label">評論者</span>
            <div class="filter-btn-group">
              <button class="fbtn filter-btn active" data-reviewer="all">
                全部
              </button>
              <button class="fbtn filter-btn" data-reviewer="Reno">Reno</button>
              <button class="fbtn filter-btn" data-reviewer="茶壺">茶壺</button>
            </div>
            <button
              class="fbtn fbtn-reset"
              id="resetAllBtn"
              onclick="resetAllFilters()"
            >
              🧹 重置條件
            </button>
          </div>
        </div>
        <div id="resultCount" class="result-count">
          <span id="resultCountText"></span>
          <span id="dataTimeLabel" class="data-time-label"></span>
        </div>
      </header>

      <div id="loading" class="loading-overlay">
        <div class="loading-content">
          <div class="loading-progress-track">
            <div id="loadingProgressBar" class="loading-progress-bar"></div>
          </div>
          <div id="loadingProgressText" class="loading-progress-text">0%</div>
          <p>正在載入書庫...</p>
        </div>
      </div>
      <div class="book-grid" id="bookGrid"></div>
    </main>

    <div id="editModal" class="modal hidden">
      <div class="modal-content">
        <h3 id="modalTitle">📝 編輯書籍資訊</h3>
        <form id="editForm">
          <input type="hidden" id="editTimestamp" name="timestamp" />
          <input type="hidden" id="editDocId" name="docId" />
          <input type="hidden" id="oldTitle" name="oldTitle" />
          <input type="hidden" name="action" value="update" />

          <div id="infoFieldsGroup">
            <label>中文書名</label>
            <input type="text" id="editTitle" name="title" required />

            <label>日文書名</label>
            <input type="text" id="editJpTitle" name="jpTitle" />

            <label>作者</label>
            <input type="text" id="editAuthor" name="author" />
            <div style="display: flex; gap: 10px; margin-bottom: 15px">
              <div style="flex: 1">
                <label
                  style="display: block; font-size: 0.9em; margin-bottom: 5px"
                  >🇹🇼 台灣狀態</label
                >
                <input
                  type="text"
                  id="editTwStatus"
                  name="twStatus"
                  placeholder="台版進度"
                />
              </div>
              <div style="flex: 1">
                <label
                  style="display: block; font-size: 0.9em; margin-bottom: 5px"
                  >🇯🇵 日本狀態</label
                >
                <input
                  type="text"
                  id="editJpStatus"
                  name="jpStatus"
                  placeholder="日版進度"
                />
              </div>
            </div>
            <div style="display: flex; gap: 15px">
              <div style="flex: 1">
                <label>分級</label>
                <select id="editLevel" name="level">
                  <option value="肉多">🥩 肉多</option>
                  <option value="正常">🍛 正常</option>
                  <option value="肉少">🥗 肉少</option>
                  <option value="清水">💧 清水</option>
                </select>
              </div>
            </div>

            <label>標籤 (以逗號 / 空白鍵分隔)</label>
            <div style="position: relative">
              <input type="text" id="editTags" name="tags" autocomplete="off" />
              <div id="customTagList" class="custom-tag-list"></div>
            </div>

            <label>電子書網址</label>
            <input type="url" id="editEbookUrl" name="ebookUrl" />

            <label>ちるちる網址</label>
            <input type="url" id="editChilUrl" name="chilUrl" />
          </div>

          <div id="commentFieldsGroup">
            <label>評分 (1-10)</label>
            <input
              type="number"
              id="editRating"
              name="rating"
              step="0.5"
              min="1"
              max="10"
            />

            <label>我的評語</label>
            <textarea
              id="editComment"
              name="comment"
              rows="6"
              placeholder="分享你的讀後感..."
            ></textarea>
          </div>

          <div class="modal-btns">
            <button type="submit" class="save-btn">儲存修改</button>
            <button type="button" onclick="closeModal()" class="cancel-btn">
              取消
            </button>
          </div>
        </form>
      </div>
    </div>

    <div id="addCommentModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="addCommentModalTitle">✍️ 新增新評論</h3>
        </div>
        <form id="addCommentForm">
          <input type="hidden" id="addCommentTargetTitle" name="title" />
          <input type="hidden" id="addCommentJpTitle" name="jpTitle" />
          <input type="hidden" id="addCommentAuthor" name="author" />
          <input type="hidden" id="addCommentLevel" name="level" />
          <input type="hidden" id="addCommentTags" name="tags" />
          <input type="hidden" id="addCommentEbookUrl" name="ebookUrl" />
          <input type="hidden" id="addCommentChilUrl" name="chilUrl" />
          <input type="hidden" id="addCommentCoverUrl" name="coverUrl" />
          <input type="hidden" id="addCommentTwStatus" name="twStatus" />
          <input type="hidden" id="addCommentJpStatus" name="jpStatus" />

          <div class="form-group">
            <label>評論者</label>
            <div class="reviewer-options">
              <button
                type="button"
                class="rev-select-btn"
                onclick="setAddReviewer('Reno', this)"
              >
                Reno
              </button>
              <button
                type="button"
                class="rev-select-btn"
                onclick="setAddReviewer('茶壺', this)"
              >
                茶壺
              </button>
            </div>
            <input
              type="hidden"
              id="addCommentReviewer"
              name="reviewer"
              required
            />
            <div id="dupReviewWarning" class="dup-review-warning">
              ⚠️ <span id="dupReviewMsg"></span>
            </div>
          </div>

          <div class="form-group">
            <label for="addCommentRating">評分 (0.0 - 10.0)</label>
            <input
              type="number"
              id="addCommentRating"
              name="rating"
              min="0"
              max="10"
              step="0.5"
              value="5.0"
            />
          </div>

          <div class="form-group">
            <label for="addCommentContent">評語內容</label>
            <textarea
              id="addCommentContent"
              name="comment"
              rows="4"
              required
            ></textarea>
          </div>

          <div class="modal-footer">
            <button
              type="submit"
              class="save-review-btn"
              id="addCommentSaveBtn"
            >
              確認送出
            </button>
            <button
              type="button"
              class="cancel-btn"
              onclick="closeAddCommentModal()"
            >
              取消
            </button>
          </div>
        </form>
      </div>
    </div>

    <div id="confirmDeleteModal" class="modal hidden">
      <div class="modal-content confirm-delete-content">
        <h3>🗑 刪除評論</h3>
        <p id="confirmDeleteMessage" class="confirm-delete-message"></p>
        <p
          id="confirmDeleteExtraWarning"
          class="confirm-delete-warning hidden"
        ></p>
        <div class="modal-btns">
          <button
            type="button"
            id="confirmDeleteBtn"
            class="danger-btn"
            onclick="executeDeleteReview()"
          >
            🗑 確定刪除
          </button>
          <button
            type="button"
            class="cancel-btn"
            onclick="closeDeleteConfirmModal()"
          >
            取消
          </button>
        </div>
      </div>
    </div>

    <div
      id="sync-toast"
      style="
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: #27ae60;
        color: white;
        padding: 10px 20px;
        border-radius: 50px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        transition: transform 0.4s;
        z-index: 9999;
        font-weight: bold;
        pointer-events: none;
      "
    >
      ✅ 資料已同步至最新版本
    </div>

    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/theme-toggle.js"></script>
    <script type="module" src="js/list/list-main.js"></script>
  </body>
</html>
