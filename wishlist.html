<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>漫畫書庫 - 待購清單</title>
    <link rel="stylesheet" href="list-style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>"
    />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="書庫" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#5f77a8" />
    <style>
      /* ── 頁面容器 ── */
      .wishlist-container {
        max-width: 800px;
        margin: 20px auto;
        padding: 0 15px 40px;
      }

      /* ── 頁首 ── */
      .wl-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .wl-header h2 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 600;
        color: var(--text-primary);
        letter-spacing: 0.01em;
      }
      .add-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #4f46e5;
        color: white;
        border: none;
        border-radius: var(--radius);
        padding: 10px 32px;
        font-size: 0.95rem;
        font-family: var(--font-body);
        font-weight: 600;
        cursor: pointer;
        transition:
          background 0.15s,
          box-shadow 0.15s,
          transform 0.1s;
        box-shadow: 0 2px 8px rgba(79, 70, 229, 0.25);
        letter-spacing: 0.01em;
      }
      .add-btn:hover {
        background: #4338ca;
        box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
        transform: translateY(-1px);
      }
      .add-btn:active {
        transform: translateY(0);
      }

      /* ── 篩選工具列 ── */
      .wl-filters {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 10px 14px;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .wl-filter-label {
        font-size: 0.78rem;
        color: var(--text-muted);
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        flex-shrink: 0;
      }
      .wl-chip {
        padding: 5px 13px;
        border-radius: 20px;
        border: 1.5px solid var(--border);
        background: white;
        font-size: 0.82rem;
        cursor: pointer;
        font-family: var(--font-body);
        color: var(--text-secondary);
        transition: all 0.15s;
        line-height: 1.4;
      }
      .wl-chip.active {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
        font-weight: 500;
      }
      .wl-chip:hover:not(.active) {
        border-color: var(--accent);
        color: var(--accent);
      }

      .wl-filter-sep {
        width: 1px;
        height: 18px;
        background: var(--border);
        flex-shrink: 0;
      }

      .wl-status-select {
        padding: 5px 10px;
        border-radius: 20px;
        border: 1.5px solid var(--border);
        background: white;
        font-size: 0.82rem;
        font-family: var(--font-body);
        color: var(--text-secondary);
        cursor: pointer;
        outline: none;
        transition: border-color 0.15s;
      }
      .wl-status-select:focus {
        border-color: var(--accent);
      }

      .show-purchased-chip {
        padding: 5px 13px;
        border-radius: 20px;
        border: 1.5px solid var(--border);
        background: white;
        font-size: 0.82rem;
        cursor: pointer;
        font-family: var(--font-body);
        color: var(--text-secondary);
        transition: all 0.15s;
        user-select: none;
        margin-left: auto;
      }
      .show-purchased-chip.active {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
        font-weight: 500;
      }
      .show-purchased-chip:hover:not(.active) {
        border-color: var(--accent);
        color: var(--accent);
      }

      .wl-result-count {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-bottom: 12px;
      }

      /* ── 書卡 ── */
      .wl-item {
        display: flex;
        align-items: stretch;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        margin-bottom: 8px;
        transition:
          box-shadow 0.2s,
          border-color 0.2s;
      }
      .wl-item:hover {
        box-shadow: var(--shadow);
        border-color: #d4d4d8;
      }
      .wl-item.purchased {
        opacity: 0.5;
      }

      /* 封面 */
      .wl-cover {
        width: 100px;
        min-height: 144px;
        flex-shrink: 0;
        background: #f8f9fb;
        position: relative;
        overflow: hidden;
        border-right: 1px solid var(--border);
        padding: 5px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wl-cover img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        border-radius: 3px;
      }
      .wl-cover .no-cover-text {
        font-size: 0.68rem;
        color: var(--text-muted);
        text-align: center;
        padding: 6px;
        line-height: 1.4;
      }

      /* 內容區 */
      .wl-body {
        flex: 1;
        padding: 9px 12px 8px;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .wl-title-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 4px;
      }
      .wl-title {
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--text-primary);
        margin: 0;
        line-height: 1.35;
        flex-grow: 1;
      }
      .shared-badge {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        font-size: 0.68rem;
        background: #fff0f0;
        color: #c0392b;
        border: 1px solid #f5c6c6;
        border-radius: 10px;
        padding: 1px 6px;
        white-space: nowrap;
        font-weight: 500;
        flex-shrink: 0;
      }
      /* 作者行：作者名 + 日文書名 inline，同 list.html */
      .wl-author {
        font-size: 0.85rem;
        color: var(--text-secondary);
        margin: 0 0 4px;
        line-height: 1.4;
      }
      .wl-jp-title {
        color: var(--text-muted);
        font-size: 0.8rem;
        font-weight: normal;
        margin-left: 6px;
      }

      /* 評論者條目 */
      .wl-entries {
        display: flex;
        flex-direction: column;
        gap: 3px;
        margin: 3px 0;
      }
      .wl-entry {
        display: flex;
        flex-direction: column;
        padding: 5px 7px;
        background: var(--bg);
        border-radius: 5px;
        gap: 3px;
      }
      .entry-top-row {
        display: flex;
        align-items: center;
        gap: 7px;
        min-height: 26px;
      }
      .entry-notes {
        font-size: 0.78rem;
        color: var(--text-secondary);
        line-height: 1.5;
        padding: 2px 4px 2px 8px;
        border-left: 2px solid var(--border);
        margin-left: 2px;
      }
      .wl-reviewer-name {
        font-size: 0.77rem;
        font-weight: 600;
        color: var(--text-primary);
        min-width: 32px;
        flex-shrink: 0;
      }
      .status-chip {
        display: inline-flex;
        align-items: center;
        padding: 1px 8px;
        border-radius: 9px;
        font-size: 0.72rem;
        font-weight: 500;
        white-space: nowrap;
        letter-spacing: 0.01em;
      }
      .status-jp_physical {
        background: #f1f2f3;
        color: #6b7280;
      }
      .status-jp_ebook {
        background: #dbeafe;
        color: #1d4ed8;
      }
      .status-tw_physical {
        background: #fef3c7;
        color: #b45309;
      }
      .status-tw_ebook {
        background: #dcfce7;
        color: #166534;
      }
      .status-purchased {
        background: #f4f4f5;
        color: #a1a1aa;
      }

      /* 書卡層級的狀態列 */
      .wl-status-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 4px 0 6px;
      }
      .edit-status-btn {
        background: none;
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 2px 7px;
        font-size: 0.72rem;
        cursor: pointer;
        color: var(--text-muted);
        font-family: var(--font-body);
        transition: all 0.15s;
      }
      .edit-status-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .entry-actions {
        display: flex;
        gap: 4px;
        margin-left: auto;
        flex-shrink: 0;
      }
      .entry-btn {
        background: none;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 3px 8px;
        font-size: 0.72rem;
        cursor: pointer;
        color: var(--text-secondary);
        font-family: var(--font-body);
        transition: all 0.15s;
        white-space: nowrap;
        line-height: 1.5;
      }
      .entry-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--accent-light);
      }
      .upgrade-btn {
        color: #166534;
        border-color: #86efac;
      }
      .upgrade-btn:hover {
        background: #dcfce7;
        border-color: #4ade80;
        color: #14532d;
      }
      .delete-btn:hover {
        border-color: #fca5a5;
        color: #dc2626;
        background: #fef2f2;
      }

      /* 備註 */
      .wl-notes {
        font-size: 0.76rem;
        color: var(--text-secondary);
        padding: 4px 8px;
        background: #fffbeb;
        border-left: 3px solid #fbbf24;
        border-radius: 0 5px 5px 0;
        margin-top: 2px;
        line-height: 1.5;
      }
      .wl-notes-label {
        font-weight: 600;
        color: #d97706;
        margin-right: 3px;
      }

      /* 外部連結 */
      .wl-links {
        display: flex;
        gap: 5px;
        margin-top: 3px;
        flex-wrap: wrap;
      }
      .wl-link {
        text-decoration: none;
        font-size: 0.78rem;
        padding: 5px 11px;
        border-radius: var(--radius);
        color: white;
        font-weight: 600;
        transition: filter 0.15s;
      }
      .wl-link:hover {
        filter: brightness(0.88);
      }
      .wl-link.ebook {
        background: #27ae60;
      }
      .wl-link.chil {
        background: #e91e63;
      }

      /* 空狀態 */
      .empty-state {
        text-align: center;
        padding: 56px 20px;
        color: var(--text-muted);
        font-size: 0.9rem;
        line-height: 1.8;
      }

      /* ── Modal ── */
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        padding: 16px;
        backdrop-filter: blur(2px);
      }
      .modal.hidden {
        display: none;
      }
      .modal-box {
        background: white;
        border-radius: var(--radius-lg);
        padding: 24px;
        width: 100%;
        max-width: 460px;
        max-height: 92vh;
        overflow-y: auto;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      }
      .modal-box h3 {
        margin: 0 0 18px;
        font-size: 1rem;
        font-weight: 600;
        color: var(--text-primary);
      }

      .mf-group {
        margin-bottom: 14px;
      }
      .mf-group label {
        display: block;
        font-size: 0.82rem;
        font-weight: 500;
        color: var(--text-secondary);
        margin-bottom: 5px;
        letter-spacing: 0.01em;
      }
      .mf-group input,
      .mf-group textarea,
      .mf-group select {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 11px;
        border: 1.5px solid var(--border);
        border-radius: 8px;
        font-size: 0.9rem;
        font-family: var(--font-body);
        color: var(--text-primary);
        background: white;
        transition: border-color 0.15s;
      }
      .mf-group input:focus,
      .mf-group textarea:focus,
      .mf-group select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(95, 119, 168, 0.1);
      }
      .mf-group textarea {
        resize: vertical;
      }

      .rev-btn-group {
        display: flex;
        gap: 8px;
      }
      .rev-select-btn {
        flex: 1;
        padding: 9px;
        border: 2px solid var(--border);
        border-radius: 8px;
        background: white;
        font-size: 0.9rem;
        font-family: var(--font-body);
        cursor: pointer;
        transition: all 0.15s;
        color: var(--text-secondary);
        font-weight: 500;
      }
      .rev-select-btn:hover {
        border-color: var(--accent);
      }
      .rev-select-btn.active {
        border-color: var(--accent);
        background: var(--accent-light);
        color: var(--accent);
        font-weight: 600;
      }

      .status-btn-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .status-select-btn {
        padding: 9px 12px;
        border: 1.5px solid var(--border);
        border-radius: 8px;
        background: white;
        font-size: 0.84rem;
        font-family: var(--font-body);
        cursor: pointer;
        text-align: left;
        transition: all 0.15s;
        color: var(--text-primary);
        line-height: 1.4;
      }
      .status-select-btn:hover {
        border-color: var(--accent);
        background: var(--accent-light);
      }
      .status-select-btn.active-jp_physical {
        border-color: #9ca3af;
        background: #f1f2f3;
        font-weight: 500;
      }
      .status-select-btn.active-jp_ebook {
        border-color: #60a5fa;
        background: #dbeafe;
        font-weight: 500;
      }
      .status-select-btn.active-tw_physical {
        border-color: #fbbf24;
        background: #fef3c7;
        font-weight: 500;
      }
      .status-select-btn.active-tw_ebook {
        border-color: #4ade80;
        background: #dcfce7;
        font-weight: 500;
      }

      .modal-footer {
        display: flex;
        gap: 8px;
        margin-top: 20px;
      }
      .modal-save-btn {
        flex: 1;
        padding: 10px;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 0.9rem;
        font-family: var(--font-body);
        cursor: pointer;
        font-weight: 500;
        transition: background 0.15s;
      }
      .modal-save-btn:hover {
        background: var(--accent-hover);
      }
      .modal-cancel-btn {
        padding: 10px 18px;
        background: none;
        border: 1.5px solid var(--border);
        border-radius: 8px;
        font-size: 0.9rem;
        font-family: var(--font-body);
        cursor: pointer;
        color: var(--text-secondary);
        transition: border-color 0.15s;
      }
      .modal-cancel-btn:hover {
        border-color: var(--text-secondary);
      }

      .fetch-hint {
        font-size: 0.77rem;
        color: var(--text-muted);
        margin-top: 4px;
      }
      .fetch-hint.success {
        color: #16a34a;
      }
      .fetch-hint.loading {
        color: var(--accent);
      }

      .divider {
        border: none;
        border-top: 1px solid var(--border);
        margin: 12px 0;
      }

      /* ── 手機 ── */
      @media (max-width: 540px) {
        /* 評論者和狀態篩選分兩排 */
        .wl-filter-sep {
          flex-basis: 100%;
          height: 0;
          width: 0;
          background: none;
        }
        /* 書卡改為上下排列：封面在上，內容在下 */
        .wl-item {
          flex-direction: column;
        }
        .wl-cover {
          width: 100%;
          height: 160px;
          min-height: unset;
          border-right: none;
          border-bottom: 1px solid var(--border);
          padding: 0;
        }
        /* 固定高度、不裁切：圖片按比例縮放置中 */
        .wl-cover img {
          object-fit: contain;
          border-radius: 0;
        }
        .wl-body {
          padding: 10px 10px 8px;
        }
        .entry-btn {
          padding: 3px 6px;
          font-size: 0.7rem;
        }
        .wl-filters {
          gap: 5px;
        }
        .show-purchased-chip {
          margin-left: auto;
        }
      }
    </style>
  </head>
  <body>
    <nav class="top-nav">
      <a href="index.html" class="nav-item">➕ 新增書籍</a>
      <a href="list.html" class="nav-item">🔍 查詢書庫</a>
      <a href="wishlist.html" class="nav-item active">🛍️ 待購清單</a>
      <a href="tags.html" class="nav-item">🏷️ 標籤管理</a>
    </nav>

    <div class="wishlist-container">
      <div class="wl-header">
        <h2>🛍️ 待購清單</h2>
        <button class="add-btn" onclick="openAddModal()">＋ 新增</button>
      </div>

      <div class="wl-filters">
        <span class="wl-filter-label">評論者</span>
        <button class="wl-chip active" data-reviewer="all">全部</button>
        <button class="wl-chip" data-reviewer="Reno">Reno</button>
        <button class="wl-chip" data-reviewer="茶壺">茶壺</button>
        <div class="wl-filter-sep"></div>
        <span class="wl-filter-label">狀態</span>
        <select
          id="statusFilter"
          class="wl-status-select"
          onchange="
            currentStatus = this.value;
            renderWishlist();
          "
        >
          <option value="all">全部</option>
          <option value="jp_physical">僅日版，僅實體</option>
          <option value="jp_ebook">僅日版，電子版</option>
          <option value="tw_physical">有台版，僅實體</option>
          <option value="tw_ebook">有台版，電子版</option>
        </select>
        <button
          class="show-purchased-chip"
          id="showPurchasedBtn"
          onclick="toggleShowPurchased(this)"
        >
          已購入
        </button>
      </div>

      <div id="resultCount" class="wl-result-count"></div>
      <div id="wishlistGrid"></div>
    </div>

    <!-- 新增 Modal -->
    <div id="addModal" class="modal hidden">
      <div class="modal-box">
        <h3>＋ 新增待購書籍</h3>
        <div class="mf-group">
          <label>ちるちる 網址（貼入後自動帶入資料）</label>
          <input
            type="url"
            id="addChilUrl"
            placeholder="https://www.chil-chil.net/goodsDetail/..."
            autocomplete="off"
          />
          <div id="addFetchHint" class="fetch-hint"></div>
        </div>
        <div class="mf-group">
          <label>BookWalker 網址（選填，補充封面）</label>
          <input
            type="url"
            id="addEbookUrl"
            placeholder="https://www.bookwalker.com.tw/..."
            autocomplete="off"
          />
        </div>
        <hr class="divider" />
        <div class="mf-group">
          <label>中文書名 <span style="color: #e74c3c">*</span></label>
          <input
            type="text"
            id="addTitle"
            placeholder="請輸入中文書名"
            autocomplete="off"
          />
          <div
            id="addTitleHint"
            style="font-size: 0.77rem; margin-top: 4px; line-height: 1.5"
          ></div>
        </div>
        <div class="mf-group">
          <label>日文書名</label>
          <input type="text" id="addJpTitle" />
        </div>
        <div class="mf-group">
          <label>作者</label>
          <input type="text" id="addAuthor" />
        </div>
        <input type="hidden" id="addCoverUrl" />
        <div class="mf-group">
          <label>評論者 <span style="color: #e74c3c">*</span></label>
          <div class="rev-btn-group">
            <button
              type="button"
              class="rev-select-btn"
              onclick="setAddReviewer('Reno', this)"
            >
              Reno
            </button>
            <button
              type="button"
              class="rev-select-btn"
              onclick="setAddReviewer('茶壺', this)"
            >
              茶壺
            </button>
          </div>
          <input type="hidden" id="addReviewer" />
        </div>
        <div class="mf-group">
          <label>狀態 <span style="color: #e74c3c">*</span></label>
          <div class="status-btn-group">
            <button
              type="button"
              class="status-select-btn"
              data-status="jp_physical"
              onclick="setStatus(this)"
            >
              僅日版，僅實體
            </button>
            <button
              type="button"
              class="status-select-btn"
              data-status="jp_ebook"
              onclick="setStatus(this)"
            >
              僅日版，電子版
            </button>
            <button
              type="button"
              class="status-select-btn"
              data-status="tw_physical"
              onclick="setStatus(this)"
            >
              有台版，僅實體
            </button>
            <button
              type="button"
              class="status-select-btn"
              data-status="tw_ebook"
              onclick="setStatus(this)"
            >
              有台版，電子版
            </button>
          </div>
          <input type="hidden" id="addStatus" />
        </div>
        <div class="mf-group">
          <label>備註（只有你自己看得到）</label>
          <textarea
            id="addNotes"
            rows="2"
            placeholder="例：預計 2025 年台版上市、因為茶壺推薦..."
          ></textarea>
        </div>
        <div class="modal-footer">
          <button class="modal-save-btn" onclick="submitAdd()">確認新增</button>
          <button class="modal-cancel-btn" onclick="closeAddModal()">
            取消
          </button>
        </div>
      </div>
    </div>

    <!-- 編輯備註 Modal -->
    <div id="editModal" class="modal hidden">
      <div class="modal-box">
        <h3 id="editModalTitle">✎ 編輯備註</h3>
        <input type="hidden" id="editTimestamp" />
        <input type="hidden" id="editTitle" />
        <div class="mf-group">
          <label>備註（只有你自己看得到）</label>
          <textarea
            id="editNotes"
            rows="3"
            placeholder="例：等特價、朋友推薦..."
          ></textarea>
        </div>
        <div class="modal-footer">
          <button class="modal-save-btn" onclick="submitEdit()">儲存</button>
          <button class="modal-cancel-btn" onclick="closeEditModal()">
            取消
          </button>
        </div>
      </div>
    </div>

    <!-- 編輯書籍狀態 Modal -->
    <div id="statusModal" class="modal hidden">
      <div class="modal-box">
        <h3 id="statusModalTitle">✎ 編輯書籍狀態</h3>
        <input type="hidden" id="statusModalBookTitle" />
        <div class="mf-group">
          <div class="status-btn-group">
            <button
              type="button"
              class="status-select-btn"
              data-status="jp_physical"
              onclick="setStatusModalStatus(this)"
            >
              僅日版，僅實體
            </button>
            <button
              type="button"
              class="status-select-btn"
              data-status="jp_ebook"
              onclick="setStatusModalStatus(this)"
            >
              僅日版，電子版
            </button>
            <button
              type="button"
              class="status-select-btn"
              data-status="tw_physical"
              onclick="setStatusModalStatus(this)"
            >
              有台版，僅實體
            </button>
            <button
              type="button"
              class="status-select-btn"
              data-status="tw_ebook"
              onclick="setStatusModalStatus(this)"
            >
              有台版，電子版
            </button>
          </div>
          <input type="hidden" id="statusModalStatus" />
        </div>
        <div class="modal-footer">
          <button class="modal-save-btn" onclick="submitStatusEdit()">
            儲存
          </button>
          <button class="modal-cancel-btn" onclick="closeStatusModal()">
            取消
          </button>
        </div>
      </div>
    </div>

    <div id="wl-toast" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:#27ae60;color:white;padding:10px 20px;border-radius:50px;box-shadow:0 4px 15px rgba(0,0,0,.2);transition:transform .4s;z-index:9999;font-weight:bold;pointer-events:none;"></div>

    <script>
      const scriptURL =
        "https://script.google.com/macros/s/AKfycbwqnfCjBq_BYZSWAOU6TnVj2O6YvFF2jan4dY0smm3waf9xP-wOLmz2_4B_L3MND7PK9A/exec";

      async function fetchWithTimeout(url, timeoutMs = 15000) {
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeoutMs);
        try {
          const res = await fetch(url, { signal: controller.signal });
          clearTimeout(id);
          return res;
        } catch (err) {
          clearTimeout(id);
          throw err;
        }
      }

      function showToast(message, type = "success") {
        const el = document.getElementById("wl-toast");
        if (!el) return;
        el.style.background = type === "error" ? "#e74c3c" : type === "info" ? "#5f77a8" : "#27ae60";
        el.textContent = message;
        el.style.transform = "translateX(-50%) translateY(0)";
        clearTimeout(el._timer);
        el._timer = setTimeout(() => { el.style.transform = "translateX(-50%) translateY(100px)"; }, 3000);
      }

      const STATUS_CONFIG = {
        jp_physical: { label: "僅日版，僅實體", cls: "status-jp_physical" },
        jp_ebook: { label: "僅日版，電子版", cls: "status-jp_ebook" },
        tw_physical: { label: "有台版，僅實體", cls: "status-tw_physical" },
        tw_ebook: { label: "有台版，電子版", cls: "status-tw_ebook" },
        purchased: { label: "✅ 已購入", cls: "status-purchased" },
      };

      let allItems = [];
      let currentReviewer = "all";
      let currentStatus = "all";
      let showPurchased = false;

      // ── 初始化 ──
      window.addEventListener("DOMContentLoaded", fetchWishlist);

      document.querySelectorAll(".wl-chip[data-reviewer]").forEach((btn) => {
        btn.addEventListener("click", function () {
          document
            .querySelectorAll(".wl-chip[data-reviewer]")
            .forEach((b) => b.classList.remove("active"));
          this.classList.add("active");
          currentReviewer = this.dataset.reviewer;
          renderWishlist();
        });
      });

      // 狀態篩選由 <select id="statusFilter"> 的 onchange 處理

      function toggleShowPurchased(btn) {
        showPurchased = !showPurchased;
        btn.classList.toggle("active", showPurchased);
        renderWishlist();
      }

      // ── 抓資料 ──
      const WISHLIST_CACHE_KEY = "wishlistCache";
      const WISHLIST_CACHE_TS_KEY = "wishlistCacheTs";
      const WISHLIST_CACHE_TTL = 3 * 60 * 1000; // 3 分鐘

      async function fetchWishlist(isManual = false) {
        // 1. 先從快取顯示，讓畫面立即有內容
        const cached = localStorage.getItem(WISHLIST_CACHE_KEY);
        const cachedTs = parseInt(localStorage.getItem(WISHLIST_CACHE_TS_KEY) || "0");
        const isFresh = cached && (Date.now() - cachedTs) < WISHLIST_CACHE_TTL;

        if (cached) {
          try {
            const parsed = JSON.parse(cached);
            if (Array.isArray(parsed)) {
              allItems = parsed;
              renderWishlist();
            }
          } catch {
            localStorage.removeItem(WISHLIST_CACHE_KEY);
            localStorage.removeItem(WISHLIST_CACHE_TS_KEY);
          }
        }

        // 快取新鮮且非手動更新，跳過背景同步
        if (isFresh && !isManual) return;

        // 2. 背景抓最新資料
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 12000);

        try {
          const res = await fetch(
            `${scriptURL}?action=readWishlist&t=${Date.now()}`,
            { signal: controller.signal }
          );
          clearTimeout(timeoutId);
          const newData = await res.json();
          const newStr = JSON.stringify(newData);

          if (newStr !== cached) {
            allItems = newData;
            localStorage.setItem(WISHLIST_CACHE_KEY, newStr);
            localStorage.setItem(WISHLIST_CACHE_TS_KEY, String(Date.now()));
            renderWishlist();
          } else {
            localStorage.setItem(WISHLIST_CACHE_TS_KEY, String(Date.now()));
          }
        } catch (e) {
          clearTimeout(timeoutId);
          console.error("載入待購清單失敗", e);
          if (!cached) {
            document.getElementById("wishlistGrid").innerHTML =
              '<div class="empty-state">❌ 載入失敗，請重新整理</div>';
          }
        }
      }

      // ── 渲染 ──
      function renderWishlist() {
        const grid = document.getElementById("wishlistGrid");

        // 過濾
        let filtered = allItems.filter((item) => {
          if (!showPurchased && item.purchased === "purchased") return false;
          if (currentReviewer !== "all" && item.reviewer !== currentReviewer)
            return false;
          if (currentStatus !== "all" && item.status !== currentStatus)
            return false;
          return true;
        });

        // 以書名合併
        const grouped = {};
        filtered.forEach((item) => {
          const key = item.title.trim();
          if (!grouped[key]) grouped[key] = { ...item, entries: [] };
          grouped[key].entries.push(item);
        });

        const groups = Object.values(grouped).map((book) => {
          // 備註共用：從所有 entries 中取第一個非空的備註
          book.notes =
            book.entries.map((e) => e.notes).find((n) => n && n.trim()) || "";
          return book;
        });

        const countEl = document.getElementById("resultCount");
        countEl.textContent =
          groups.length > 0 ? `共 ${groups.length} 本書籍` : "";

        if (groups.length === 0) {
          grid.innerHTML =
            '<div class="empty-state">📭 目前沒有符合條件的待購書籍</div>';
          return;
        }

        grid.innerHTML = groups
          .map((book) => {
            const isShared =
              book.entries.length >= 2 ||
              allItems.filter(
                (i) =>
                  i.title.trim() === book.title.trim() &&
                  i.purchased !== "purchased",
              ).length >= 2;

            const coverHTML = book.coverUrl
              ? `<img src="${book.coverUrl}" alt="封面" loading="lazy">`
              : `<div class="no-cover-text">無封面</div>`;

            // 狀態是書籍屬性，取第一筆 entry 的狀態代表整本書
            const bookStatus = book.status;
            const bsc = STATUS_CONFIG[bookStatus] || {};
            const statusRowHTML = `
            <div class="wl-status-row">
              <span class="status-chip ${bsc.cls || ""}">${bsc.label || bookStatus}</span>
              <button class="edit-status-btn" onclick="openStatusModal('${escQ(book.title)}', '${escQ(bookStatus)}')">✎ 狀態</button>
            </div>`;

            const entriesHTML = book.entries
              .map((entry) => {
                const entryNotes = entry.notes
                  ? `<div class="entry-notes">${escH(entry.notes)}</div>`
                  : "";
                const isPurchased = entry.purchased === "purchased";
                return `
              <div class="wl-entry">
                <div class="entry-top-row">
                  <span class="wl-reviewer-name">${entry.reviewer}</span>
                  ${isPurchased ? '<span style="font-size:0.72rem;color:#a1a1aa;">✅ 已購入</span>' : ""}
                  <div class="entry-actions">
                    <button class="entry-btn" onclick="openEditModal('${entry.timestamp}', '${escQ(entry.title)}', '${escQ(entry.notes)}')">✎ 備註</button>
                    ${!isPurchased ? `<button class="entry-btn upgrade-btn" onclick="upgradeToArchive('${entry.timestamp}', '${escQ(entry.title)}', '${escQ(entry.jpTitle)}', '${escQ(entry.author)}', '${escQ(entry.ebookUrl)}', '${escQ(entry.chilUrl)}', '${escQ(entry.coverUrl)}')">📚 升級</button>` : ""}
                    <button class="entry-btn delete-btn" onclick="deleteEntry('${entry.timestamp}')">🗑</button>
                  </div>
                </div>
                ${entryNotes}
              </div>`;
              })
              .join("");

            const notesHTML = "";

            const linksHTML = [
              book.ebookUrl
                ? `<a href="${book.ebookUrl}" target="_blank" class="wl-link ebook">📖 Bookwalker</a>`
                : "",
              book.chilUrl
                ? `<a href="${book.chilUrl}"  target="_blank" class="wl-link chil">🍒 ちるちる</a>`
                : "",
            ]
              .filter(Boolean)
              .join("");

            return `
            <div class="wl-item${book.entries.every((e) => e.purchased === "purchased") ? " purchased" : ""}">
              <div class="wl-cover">${coverHTML}</div>
              <div class="wl-body">
                <div class="wl-title-row">
                  <h3 class="wl-title">${escH(book.title)}</h3>
                  ${isShared ? '<span class="shared-badge">♡ 共同心願</span>' : ""}
                </div>
                <p class="wl-author">
                  👤 ${escH(book.author || "")}${book.jpTitle ? `<span class="wl-jp-title">${escH(book.jpTitle)}</span>` : ""}
                </p>
                ${statusRowHTML}
                <div class="wl-entries">${entriesHTML}</div>
                ${notesHTML}
                ${linksHTML ? `<div class="wl-links">${linksHTML}</div>` : ""}
              </div>
            </div>`;
          })
          .join("");
      }

      // ── 工具函式 ──
      function escH(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function escQ(s) {
        return String(s || "").replace(/'/g, "\\'");
      }

      // ── 新增 Modal ──
      let addReviewer = "";
      let addStatus = "";

      function openAddModal() {
        addReviewer = "";
        addStatus = "";
        document.getElementById("addModal").classList.remove("hidden");
        document.getElementById("addChilUrl").value = "";
        document.getElementById("addEbookUrl").value = "";
        document.getElementById("addTitle").value = "";
        document.getElementById("addJpTitle").value = "";
        document.getElementById("addAuthor").value = "";
        document.getElementById("addCoverUrl").value = "";
        document.getElementById("addNotes").value = "";
        document.getElementById("addReviewer").value = "";
        document.getElementById("addStatus").value = "";
        document.getElementById("addFetchHint").textContent = "";
        document.getElementById("addTitleHint").textContent = "";
        document.getElementById("addTitleHint").style.color = "";
        document
          .querySelectorAll(".rev-select-btn")
          .forEach((b) => b.classList.remove("active"));
        document
          .querySelectorAll("#addModal .status-select-btn")
          .forEach((b) => (b.className = "status-select-btn"));
      }

      function closeAddModal() {
        document.getElementById("addModal").classList.add("hidden");
      }

      function setAddReviewer(name, btn) {
        addReviewer = name;
        document.getElementById("addReviewer").value = name;
        document
          .querySelectorAll(".rev-select-btn")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        checkTitleDuplicate(); // 選完評論者重新判斷
      }

      function setStatus(btn) {
        const s = btn.dataset.status;
        addStatus = s;
        document.getElementById("addStatus").value = s;
        document
          .querySelectorAll("#addModal .status-select-btn")
          .forEach((b) => {
            b.className = "status-select-btn";
          });
        btn.classList.add("active-" + s);

        // 選「尚未有日版電子書」或「日文版待購」時，若中文書名空白且日文書名有值，自動帶入
        if (s === "jp_physical" || s === "jp_ebook") {
          const titleEl = document.getElementById("addTitle");
          const jpTitleEl = document.getElementById("addJpTitle");
          if (!titleEl.value.trim() && jpTitleEl.value.trim()) {
            titleEl.value = jpTitleEl.value.trim();
            checkTitleDuplicate();
          }
        }
      }

      // 新增書名重複偵測（書名輸入、選評論者時都觸發）
      function checkTitleDuplicate() {
        const hint = document.getElementById("addTitleHint");
        const inputTitle = document
          .getElementById("addTitle")
          .value.trim()
          .toLowerCase();
        if (!inputTitle) {
          hint.textContent = "";
          return;
        }

        const matches = allItems.filter(
          (i) =>
            i.purchased !== "purchased" &&
            i.title.trim().toLowerCase() === inputTitle,
        );

        if (matches.length === 0) {
          hint.textContent = "";
          return;
        }

        if (addReviewer) {
          const mine = matches.find((i) => i.reviewer === addReviewer);
          const theirs = matches.find((i) => i.reviewer !== addReviewer);
          if (mine) {
            const sc = STATUS_CONFIG[mine.status] || {};
            hint.textContent = `⚠️ 你已有這本書（${sc.label || mine.status}）`;
            hint.style.color = "#d97706";
          } else if (theirs) {
            hint.textContent = `♡ 對方也有這本書，新增後會顯示「共同心願」`;
            hint.style.color = "#c0392b";
          }
        } else {
          // 還沒選評論者時，顯示所有已有的人
          const names = [...new Set(matches.map((i) => i.reviewer))].join("、");
          hint.textContent = `📋 ${names} 的待購清單已有這本書`;
          hint.style.color = "#6b7280";
        }
      }

      document
        .getElementById("addTitle")
        .addEventListener("input", checkTitleDuplicate);

      // ちるちる 自動帶入
      document
        .getElementById("addChilUrl")
        .addEventListener("change", async function () {
          const url = this.value.trim();
          if (!url || url.indexOf("chil-chil.net") === -1) return;
          const hint = document.getElementById("addFetchHint");
          hint.textContent = "🔍 正在抓取資料...";
          hint.className = "fetch-hint loading";
          try {
            const res = await fetchWithTimeout(
              `${scriptURL}?action=fetchMeta&url=${encodeURIComponent(url)}`,
            );
            const data = await res.json();
            const filled = [];
            if (data.jpTitle && !document.getElementById("addJpTitle").value) {
              document.getElementById("addJpTitle").value = data.jpTitle;
              filled.push("日文書名");
            }
            if (data.author && !document.getElementById("addAuthor").value) {
              document.getElementById("addAuthor").value = data.author;
              filled.push("作者");
            }
            if (
              data.coverUrl &&
              !document.getElementById("addCoverUrl").value
            ) {
              document.getElementById("addCoverUrl").value = data.coverUrl;
              filled.push("封面");
            }
            hint.textContent = filled.length
              ? `✅ 已帶入：${filled.join("、")}（中文書名請手動填）`
              : "⚠️ 未能自動帶入";
            hint.className = "fetch-hint " + (filled.length ? "success" : "");
          } catch (e) {
            hint.textContent = "❌ 抓取失敗";
            hint.className = "fetch-hint";
          }
        });

      // BookWalker 封面
      document
        .getElementById("addEbookUrl")
        .addEventListener("change", async function () {
          const url = this.value.trim();
          if (!url) return;
          try {
            const res = await fetchWithTimeout(
              `${scriptURL}?action=fetchCover&url=${encodeURIComponent(url)}`,
            );
            const data = await res.json();
            if (data.coverUrl)
              document.getElementById("addCoverUrl").value = data.coverUrl;
          } catch (e) {}
        });

      async function submitAdd() {
        const title = document.getElementById("addTitle").value.trim();
        const reviewer = document.getElementById("addReviewer").value;
        const status = document.getElementById("addStatus").value;
        if (!title) {
          showToast("❌ 請填入中文書名", "error");
          return;
        }
        if (!reviewer) {
          showToast("❌ 請選擇評論者", "error");
          return;
        }
        if (!status) {
          showToast("❌ 請選擇狀態", "error");
          return;
        }

        const newItem = {
          timestamp: String(Date.now()),
          title,
          jpTitle: document.getElementById("addJpTitle").value.trim(),
          author: document.getElementById("addAuthor").value.trim(),
          reviewer,
          status,
          notes: document.getElementById("addNotes").value.trim(),
          ebookUrl: document.getElementById("addEbookUrl").value.trim(),
          chilUrl: document.getElementById("addChilUrl").value.trim(),
          coverUrl: document.getElementById("addCoverUrl").value.trim(),
          purchased: "",
        };

        // 樂觀更新：先把新項目加到畫面，不等 GAS 回應
        allItems.push(newItem);
        renderWishlist();
        closeAddModal();
        showToast("✅ 已加入待購清單", "success");

        const fd = new FormData();
        fd.append("action", "addWishlist");
        fd.append("title", newItem.title);
        fd.append("jpTitle", newItem.jpTitle);
        fd.append("author", newItem.author);
        fd.append("reviewer", newItem.reviewer);
        fd.append("status", newItem.status);
        fd.append("notes", newItem.notes);
        fd.append("ebookUrl", newItem.ebookUrl);
        fd.append("chilUrl", newItem.chilUrl);
        fd.append("coverUrl", newItem.coverUrl);

        try {
          await fetch(scriptURL, { method: "POST", body: fd, mode: "no-cors" });
          localStorage.setItem(WISHLIST_CACHE_KEY, JSON.stringify(allItems));
          setTimeout(() => fetchWishlist(true), 3000); // 3 秒後再確認 GAS 寫入的真實 timestamp
        } catch (e) {
          showToast("❌ 新增失敗：" + e.message, "error");
          allItems = allItems.filter((i) => i.timestamp !== newItem.timestamp);
          renderWishlist();
        }
      }

      // ── 編輯備註 Modal ──
      function openEditModal(ts, title, notes) {
        document.getElementById("editTimestamp").value = ts;
        document.getElementById("editTitle").value = title;
        document.getElementById("editNotes").value = notes || "";
        document.getElementById("editModalTitle").textContent =
          `✎ 備註 —「${title}」`;
        document.getElementById("editModal").classList.remove("hidden");
      }

      function closeEditModal() {
        document.getElementById("editModal").classList.add("hidden");
      }

      async function submitEdit() {
        const ts = document.getElementById("editTimestamp").value;
        const title = document.getElementById("editTitle").value;
        const notes = document.getElementById("editNotes").value.trim();

        // 樂觀更新（只更新自己那筆）
        allItems.forEach((item) => {
          if (item.timestamp === ts) item.notes = notes;
        });
        renderWishlist();
        closeEditModal();
        showToast("✅ 備註已更新", "success");

        const fd = new FormData();
        fd.append("action", "updateWishlist");
        fd.append("timestamp", ts);
        fd.append("notes", notes);

        try {
          await fetch(scriptURL, { method: "POST", body: fd, mode: "no-cors" });
          localStorage.setItem(WISHLIST_CACHE_KEY, JSON.stringify(allItems));
          setTimeout(() => fetchWishlist(true), 3000);
        } catch (e) {
          showToast("❌ 更新失敗：" + e.message, "error");
        }
      }

      // ── 編輯書籍狀態 Modal ──
      function openStatusModal(title, currentStatus) {
        document.getElementById("statusModalBookTitle").value = title;
        document.getElementById("statusModalStatus").value = currentStatus;
        document.getElementById("statusModalTitle").textContent =
          `✎ 書籍狀態 —「${title}」`;
        document
          .querySelectorAll("#statusModal .status-select-btn")
          .forEach((b) => {
            b.className = "status-select-btn";
            if (b.dataset.status === currentStatus)
              b.classList.add("active-" + currentStatus);
          });
        document.getElementById("statusModal").classList.remove("hidden");
      }

      function closeStatusModal() {
        document.getElementById("statusModal").classList.add("hidden");
      }

      function setStatusModalStatus(btn) {
        const s = btn.dataset.status;
        document.getElementById("statusModalStatus").value = s;
        document
          .querySelectorAll("#statusModal .status-select-btn")
          .forEach((b) => {
            b.className = "status-select-btn";
          });
        btn.classList.add("active-" + s);
      }

      async function submitStatusEdit() {
        const title = document.getElementById("statusModalBookTitle").value;
        const status = document.getElementById("statusModalStatus").value;
        if (!status) {
          showToast("❌ 請選擇狀態", "error");
          return;
        }

        // 樂觀更新：同書名的所有項目都更新
        allItems.forEach((item) => {
          if (item.title.trim() === title.trim()) item.status = status;
        });
        renderWishlist();
        closeStatusModal();
        showToast("✅ 狀態已更新", "success");

        const fd = new FormData();
        fd.append("action", "updateWishlist");
        fd.append("title", title);
        fd.append("status", status);

        try {
          await fetch(scriptURL, { method: "POST", body: fd, mode: "no-cors" });
          localStorage.setItem(WISHLIST_CACHE_KEY, JSON.stringify(allItems));
          setTimeout(() => fetchWishlist(true), 3000);
        } catch (e) {
          showToast("❌ 更新失敗：" + e.message, "error");
        }
      }

      // ── 升級到書庫 ──
      async function upgradeToArchive(
        ts,
        title,
        jpTitle,
        author,
        ebookUrl,
        chilUrl,
        coverUrl,
      ) {
        if (!confirm(`將《${title}》升級到書庫，並標記此待購項目為已購入？`))
          return;

        // 標記已購入
        const fd = new FormData();
        fd.append("action", "updateWishlist");
        fd.append("timestamp", ts);
        fd.append("purchased", "purchased");
        await fetch(scriptURL, { method: "POST", body: fd, mode: "no-cors" });

        // 帶資料前往 index.html
        const params = new URLSearchParams({
          prefill: "1",
          title,
          jpTitle,
          author,
          ebookUrl,
          chilUrl,
          coverUrl,
        });
        window.location.href = "index.html?" + params.toString();
      }

      // ── 刪除 ──
      async function deleteEntry(ts) {
        if (!confirm("確定要刪除這筆待購紀錄嗎？")) return;

        // 樂觀更新
        allItems = allItems.filter((i) => i.timestamp !== ts);
        renderWishlist();
        showToast("🗑️ 已刪除待購紀錄", "info");

        const fd = new FormData();
        fd.append("action", "deleteWishlist");
        fd.append("timestamp", ts);
        try {
          await fetch(scriptURL, { method: "POST", body: fd, mode: "no-cors" });
          localStorage.setItem(WISHLIST_CACHE_KEY, JSON.stringify(allItems));
          setTimeout(() => fetchWishlist(true), 3000);
        } catch (e) {
          showToast("❌ 刪除失敗：" + e.message, "error");
        }
      }
    </script>
  </body>
</html>
