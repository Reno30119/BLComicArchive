<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 深色模式：在 CSS 套用前就把明確設定寫到 <html> 上，避免載入時先閃一下
      // 錯的主題色再變回來。詳細切換邏輯在 js/theme-toggle.js。
      (function () {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>漫畫書庫 - 待購清單</title>
    <link rel="stylesheet" href="css/list-style.css" />
    <link rel="stylesheet" href="css/wishlist-style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>"
    />
    <link rel="manifest" href="assets/manifest.json" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="書庫" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#5f77a8" />
  </head>
  <body>
    <nav class="top-nav">
      <a href="index.html" class="nav-item"
        ><span class="nav-icon">➕</span
        ><span class="nav-label">新增書籍</span></a
      >
      <a href="list.html" class="nav-item"
        ><span class="nav-icon">🔍</span
        ><span class="nav-label">查詢書庫</span></a
      >
      <a href="wishlist.html" class="nav-item active"
        ><span class="nav-icon">🛍️</span
        ><span class="nav-label">待購清單</span></a
      >
      <a href="tags.html" class="nav-item"
        ><span class="nav-icon">🏷️</span
        ><span class="nav-label">標籤管理</span></a
      >
      <a href="backup.html" class="nav-item nav-item-icon-only" title="資料備份"
        ><span class="nav-icon">💾</span></a
      >
      <span class="theme-toggle-wrap">
        <span class="theme-toggle-icon" aria-hidden="true">☀️</span>
        <button type="button" class="theme-toggle-switch" aria-label="切換深色模式"><span class="theme-toggle-knob"></span></button>
        <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
      </span>
    </nav>

    <div class="wishlist-container">
      <div class="wl-header">
        <h2>🛍️ 待購清單</h2>
        <button class="add-btn" onclick="openAddModal()">＋ 新增</button>
      </div>

      <div class="search-bar">
        <div
          style="
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
          "
        >
          <input
            type="text"
            id="searchInput"
            placeholder="搜尋書名或作者..."
            aria-label="搜尋書名或作者"
            style="width: 100%; padding-right: 30px"
            autocomplete="off"
          />
          <span
            id="clearSearch"
            style="
              position: absolute;
              right: 20px;
              cursor: pointer;
              color: #ccc;
              display: none;
            "
            >✖</span
          >
          <div id="searchRecommendationList" class="custom-tag-list"></div>
        </div>
        <button
          id="wlRefreshBtn"
          class="refresh-btn"
          onclick="fetchWishlist(true)"
        >
          🔄 更新書庫
        </button>
      </div>

      <div class="wl-filters">
        <span class="wl-filter-label">評論者</span>
        <button class="wl-chip active" data-reviewer="all">全部</button>
        <button class="wl-chip" data-reviewer="Reno">Reno</button>
        <button class="wl-chip" data-reviewer="茶壺">茶壺</button>
        <div class="wl-filter-sep"></div>
        <span class="wl-filter-label">狀態</span>
        <div class="custom-select-wrap" id="statusFilterWrap">
          <button
            type="button"
            id="statusFilterToggle"
            class="wl-chip custom-select-toggle"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="statusFilterDropdown"
          >
            <span class="custom-select-label">全部</span>
          </button>
          <div
            id="statusFilterDropdown"
            class="custom-select-dropdown hidden"
            role="listbox"
          >
            <div class="custom-select-option" data-value="all" role="option">全部</div>
            <div class="custom-select-option" data-value="jp_physical" role="option">
              僅日版，僅實體
            </div>
            <div class="custom-select-option" data-value="jp_ebook" role="option">
              僅日版，電子版
            </div>
            <div class="custom-select-option" data-value="tw_physical" role="option">
              有台版，僅實體
            </div>
            <div class="custom-select-option" data-value="tw_ebook" role="option">
              有台版，電子版
            </div>
          </div>
        </div>
        <div class="wl-filter-sep"></div>
        <span class="wl-filter-label">排序</span>
        <button class="wl-chip active" id="sortToggleBtn">
          📅 新增日期<span class="sort-dir-arrow" aria-hidden="true">▼</span>
        </button>
        <button
          class="show-purchased-chip"
          id="showPurchasedBtn"
          onclick="toggleShowPurchased(this)"
        >
          已購入
        </button>
      </div>

      <div id="resultCount" class="wl-result-count">
        <span id="resultCountText"></span>
        <span id="dataTimeLabel" class="data-time-label"></span>
      </div>
      <div id="wishlistGrid"></div>
    </div>

    <!-- 新增 Modal -->
    <div id="addModal" class="modal hidden">
      <div class="modal-box">
        <h3>＋ 新增待購書籍</h3>
        <div class="mf-group">
          <label>ちるちる 網址（可自動補入封面）</label>
          <input type="url" id="addChilUrl" autocomplete="off" />
          <div id="addFetchHint" class="fetch-hint"></div>
        </div>
        <div class="mf-group">
          <label>BookWalker 網址（選填，補充封面）</label>
          <input type="url" id="addEbookUrl" autocomplete="off" />
        </div>

        <div id="addCoverPreviewWrap" class="cover-preview-wrap">
          <div class="cover-preview-frame">
            <img
              id="addCoverPreviewImg"
              class="cover-preview-img"
              alt="封面預覽"
            />
            <div
              id="addCoverPreviewPlaceholder"
              class="cover-preview-placeholder"
            ></div>
          </div>
          <div class="cover-preview-info">
            <div class="cover-preview-label">🖼️ 封面預覽</div>
            <div id="addCoverPreviewHint" class="cover-preview-hint"></div>
          </div>
        </div>

        <hr class="divider" />
        <div class="mf-group">
          <label>中文書名 <span style="color: #e74c3c">*</span></label>
          <input
            type="text"
            id="addTitle"
            placeholder="請輸入中文書名"
            autocomplete="off"
          />
          <div
            id="addTitleHint"
            style="font-size: 0.77rem; margin-top: 4px; line-height: 1.5"
          ></div>
        </div>
        <div class="mf-group">
          <label>日文書名</label>
          <input type="text" id="addJpTitle" />
        </div>
        <div class="mf-group">
          <label>作者</label>
          <input type="text" id="addAuthor" />
        </div>
        <input type="hidden" id="addCoverUrl" />
        <div class="mf-group">
          <label>評論者 <span style="color: #e74c3c">*</span></label>
          <div class="rev-btn-group">
            <button
              type="button"
              class="rev-select-btn"
              onclick="setAddReviewer('Reno', this)"
            >
              Reno
            </button>
            <button
              type="button"
              class="rev-select-btn"
              onclick="setAddReviewer('茶壺', this)"
            >
              茶壺
            </button>
          </div>
          <input type="hidden" id="addReviewer" />
        </div>
        <div class="mf-group">
          <label>狀態 <span style="color: #e74c3c">*</span></label>
          <div class="status-btn-group">
            <button
              type="button"
              class="status-select-btn"
              data-status="jp_physical"
              onclick="setStatus(this)"
            >
              僅日版，僅實體
            </button>
            <button
              type="button"
              class="status-select-btn"
              data-status="jp_ebook"
              onclick="setStatus(this)"
            >
              僅日版，電子版
            </button>
            <button
              type="button"
              class="status-select-btn"
              data-status="tw_physical"
              onclick="setStatus(this)"
            >
              有台版，僅實體
            </button>
            <button
              type="button"
              class="status-select-btn"
              data-status="tw_ebook"
              onclick="setStatus(this)"
            >
              有台版，電子版
            </button>
          </div>
          <input type="hidden" id="addStatus" />
        </div>
        <div class="mf-group">
          <label>備註</label>
          <textarea id="addNotes" rows="2"></textarea>
        </div>
        <div class="modal-footer">
          <button class="modal-save-btn" onclick="submitAdd()">確認新增</button>
          <button class="modal-cancel-btn" onclick="closeAddModal()">
            取消
          </button>
        </div>
      </div>
    </div>

    <!-- 編輯書籍資訊 Modal -->
    <div id="bookInfoModal" class="modal hidden">
      <div class="modal-box">
        <h3 id="bookInfoModalTitle">⚙️ 編輯書籍資訊</h3>
        <input type="hidden" id="bookInfoOldTitle" />
        <div class="mf-group">
          <label>中文書名 <span style="color: #e74c3c">*</span></label>
          <input type="text" id="bookInfoTitle" autocomplete="off" />
        </div>
        <div class="mf-group">
          <label>日文書名</label>
          <input type="text" id="bookInfoJpTitle" autocomplete="off" />
        </div>
        <div class="mf-group">
          <label>作者</label>
          <input type="text" id="bookInfoAuthor" autocomplete="off" />
        </div>
        <div class="mf-group">
          <label>BookWalker 網址</label>
          <input type="url" id="bookInfoEbookUrl" autocomplete="off" />
        </div>
        <div class="mf-group">
          <label>ちるちる 網址</label>
          <input type="url" id="bookInfoChilUrl" autocomplete="off" />
        </div>
        <div class="modal-footer">
          <button class="modal-save-btn" onclick="submitBookInfoEdit()">
            儲存
          </button>
          <button class="modal-cancel-btn" onclick="closeBookInfoModal()">
            取消
          </button>
        </div>
      </div>
    </div>

    <!-- 編輯備註 Modal -->
    <div id="editModal" class="modal hidden">
      <div class="modal-box">
        <h3 id="editModalTitle">✎ 編輯備註</h3>
        <input type="hidden" id="editTimestamp" />
        <input type="hidden" id="editTitle" />
        <div class="mf-group">
          <label>備註</label>
          <textarea id="editNotes" rows="3"></textarea>
        </div>
        <div class="modal-footer">
          <button class="modal-save-btn" onclick="submitEdit()">儲存</button>
          <button class="modal-cancel-btn" onclick="closeEditModal()">
            取消
          </button>
        </div>
      </div>
    </div>

    <!-- 編輯書籍狀態 Modal -->
    <div id="statusModal" class="modal hidden">
      <div class="modal-box">
        <h3 id="statusModalTitle">✎ 編輯書籍狀態</h3>
        <input type="hidden" id="statusModalBookTitle" />
        <div class="mf-group">
          <div class="status-btn-group">
            <button
              type="button"
              class="status-select-btn"
              data-status="jp_physical"
              onclick="setStatusModalStatus(this)"
            >
              僅日版，僅實體
            </button>
            <button
              type="button"
              class="status-select-btn"
              data-status="jp_ebook"
              onclick="setStatusModalStatus(this)"
            >
              僅日版，電子版
            </button>
            <button
              type="button"
              class="status-select-btn"
              data-status="tw_physical"
              onclick="setStatusModalStatus(this)"
            >
              有台版，僅實體
            </button>
            <button
              type="button"
              class="status-select-btn"
              data-status="tw_ebook"
              onclick="setStatusModalStatus(this)"
            >
              有台版，電子版
            </button>
          </div>
          <input type="hidden" id="statusModalStatus" />
        </div>
        <div class="modal-footer">
          <button class="modal-save-btn" onclick="submitStatusEdit()">
            儲存
          </button>
          <button class="modal-cancel-btn" onclick="closeStatusModal()">
            取消
          </button>
        </div>
      </div>
    </div>

    <!-- 刪除／升級確認 Modal -->
    <div id="wlConfirmModal" class="modal hidden">
      <div class="modal-box">
        <h3 id="wlConfirmTitle">🗑 刪除待購紀錄</h3>
        <p id="wlConfirmMessage" class="wl-confirm-message"></p>
        <p id="wlConfirmWarning" class="wl-confirm-warning hidden"></p>
        <div class="modal-footer">
          <button
            type="button"
            id="wlConfirmBtn"
            class="modal-danger-btn"
            onclick="executeWlConfirmAction()"
          >
            🗑 確定刪除
          </button>
          <button
            type="button"
            class="modal-cancel-btn"
            onclick="closeWlConfirmModal()"
          >
            取消
          </button>
        </div>
      </div>
    </div>

    <div
      id="wl-toast"
      style="
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: #27ae60;
        color: white;
        padding: 10px 20px;
        border-radius: 50px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        transition: transform 0.4s;
        z-index: 9999;
        font-weight: bold;
        pointer-events: none;
      "
    ></div>

    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/theme-toggle.js"></script>
    <script type="module" src="js/wishlist/wishlist-main.js"></script>
  </body>
</html>
