<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 深色模式：在 CSS 套用前就把明確設定寫到 <html> 上，避免載入時先閃一下
      // 錯的主題色再變回來。詳細切換邏輯在 js/theme-toggle.js。
      (function () {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>標籤管理 - 漫畫書庫</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/tags-style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏷️</text></svg>"
    />
    <link rel="manifest" href="assets/manifest.json" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="書庫" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#5f77a8" />
  </head>
  <body>
    <nav class="top-nav">
      <a href="index.html" class="nav-item"><span class="nav-icon">➕</span><span class="nav-label">新增書籍</span></a>
      <a href="list.html" class="nav-item"><span class="nav-icon">🔍</span><span class="nav-label">查詢書庫</span></a>
      <a href="wishlist.html" class="nav-item"><span class="nav-icon">🛍️</span><span class="nav-label">待購清單</span></a>
      <a href="tags.html" class="nav-item active"><span class="nav-icon">🏷️</span><span class="nav-label">標籤管理</span></a>
      <a href="backup.html" class="nav-item nav-item-icon-only" title="資料備份"><span class="nav-icon">💾</span></a>
      <span class="theme-toggle-wrap">
        <span class="theme-toggle-icon" aria-hidden="true">☀️</span>
        <button type="button" class="theme-toggle-switch" aria-label="切換深色模式"><span class="theme-toggle-knob"></span></button>
        <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
      </span>
    </nav>

    <div class="container">
      <h2>🏷️ 標籤管理</h2>
      <p class="subtitle" id="tagCountSubtitle">&nbsp;</p>

      <!-- 搜尋 -->
      <div class="form-section-header">
        <span class="section-icon">🔍</span>
        <h3 class="section-title">搜尋標籤</h3>
      </div>
      <div class="form-group" style="margin-bottom: 0">
        <input
          type="text"
          id="tagSearchInput"
          placeholder="搜尋標籤名稱或定義..."
        />
      </div>

      <!-- 新增 / 編輯表單 -->
      <div class="form-section-header">
        <span class="section-icon">✏️</span>
        <h3 class="section-title" id="formTitle">新增標籤定義</h3>
      </div>
      <div class="form-box">
        <input type="hidden" id="tagOldName" />
        <input type="text" id="tagName" placeholder="標籤名稱" />
        <div id="tagNameHint"></div>
        <textarea
          id="tagDefinition"
          rows="2"
          placeholder="輸入標籤定義..."
          style="margin-top: 10px"
        ></textarea>
        <div id="statusMsg"></div>
        <div style="display: flex; gap: 10px; margin-top: 10px">
          <button
            id="saveTagBtn"
            class="rev-btn active"
            style="flex: 2; margin-top: 0"
          >
            新增標籤
          </button>
          <button
            id="cancelEditBtn"
            class="rev-btn"
            style="
              flex: 1;
              margin-top: 0;
              background: var(--text-muted);
              color: #fff;
              display: none;
            "
          >
            取消
          </button>
        </div>
      </div>

      <!-- 標籤清單 -->
      <div class="form-section-header" style="margin-top: 24px">
        <span class="section-icon">📋</span>
        <h3 class="section-title" id="listTitle">標籤清單</h3>
      </div>
      <div id="tagList">
        <p class="tag-list-empty">載入標籤中...</p>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/theme-toggle.js"></script>
    <script type="module" src="js/tags/tags-main.js"></script>
  </body>
</html>
